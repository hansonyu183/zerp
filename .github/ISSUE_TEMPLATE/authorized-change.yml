name: ZERP 自动交付变更
description: 定义可在授权后由自动化独立交付到生产的完整工作项
title: '[Change]: '
labels:
  - priority:p2
body:
  - type: markdown
    attributes:
      value: |
        提交只创建工作项，不会启动实现。维护者确认内容可客观验收后，才会添加 `automation:ready` 进行唯一一次人工授权。
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: 交付完成后，用户或系统得到的可观察结果。
      placeholder: 说明最终结果，不写实现步骤。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 本次必须包含的页面、接口、数据或运维表面。
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Exclusions
      description: 明确本次不处理的相邻范围；如果没有，填写“无”。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: 使用可重复的 Given/When/Then、命令、URL 或可观察断言描述完成条件。
      placeholder: |
        - [ ] Given ... When ... Then ...
        - [ ] 精确 SHA 的浏览器场景 ...
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      options:
        - Low
        - High — authentication, migration, production config, or data repair
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: 高风险工作必须列出具体失败模式；低风险填写“低风险：不适用”。
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: Recovery conditions
      description: 高风险工作必须说明何时以及如何安全恢复；低风险填写“低风险：不适用”。
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Linked specifications
      description: 列出本仓库内相关 docs/domains、docs/use-cases、OpenAPI 或 ADR 路径；没有则填写“无”。
    validations:
      required: true
