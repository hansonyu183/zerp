name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs-format:
    name: docs-format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.CI_COMMIT_SHA }}
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make check-common
        env:
          DOCS_USE_CASE_MISSING_BASELINE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  target:
    name: target
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_COMMIT_SHA }}
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: packages/wfl-starlark/go/go.mod
          cache-dependency-path: packages/wfl-starlark/go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zerp/frontend exec playwright install --with-deps chromium
      - run: TARGET_POSTGRES_PASSWORD=zerp-target-ci make target-e2e
      - name: Clean disposable target resources
        if: always()
        run: TARGET_POSTGRES_PASSWORD=zerp-target-ci make target-down
