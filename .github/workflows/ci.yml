name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      level: ${{ steps.classify.outputs.level }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        name: Classify tested merge
        shell: bash
        run: |
          set -euo pipefail

          paths_file="$(mktemp)"
          baseline_classifier="$(mktemp --suffix=.mjs)"
          trap 'rm -f "$paths_file" "$baseline_classifier"' EXIT

          if ! base_sha="$(git rev-parse HEAD^1 2>/dev/null)"; then
            echo "level=L3" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git diff --name-only --no-renames "$base_sha" HEAD -- > "$paths_file"; then
            echo "level=L3" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_level="$(node scripts/ci/classify.mjs --paths-file "$paths_file")"
          if git cat-file -e "$base_sha:scripts/ci/classify.mjs" 2>/dev/null; then
            git show "$base_sha:scripts/ci/classify.mjs" > "$baseline_classifier"
            baseline_level="$(node "$baseline_classifier" --paths-file "$paths_file")"
          else
            baseline_level=L3
          fi

          case "$baseline_level:$current_level" in
            L3:*|*:L3) level=L3 ;;
            L1:*|*:L1) level=L1 ;;
            L0:L0) level=L0 ;;
            *) echo "invalid classification output" >&2; exit 1 ;;
          esac
          echo "level=$level" >> "$GITHUB_OUTPUT"

  common:
    name: common
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: base
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make check-common
        env:
          DOCS_USE_CASE_MISSING_BASELINE_BASE: ${{ steps.base.outputs.sha }}

  tooling:
    name: tooling
    needs: changes
    if: ${{ needs.changes.outputs.level != 'L0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ci-workflow

  target:
    name: target
    needs: changes
    if: ${{ needs.changes.outputs.level == 'L3' }}
    uses: ./.github/workflows/target.yml

  ci-required:
    name: ci-required
    needs: [changes, common, tooling, target]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Enforce required jobs
        run: >-
          node scripts/ci/required.mjs
          --level '${{ needs.changes.outputs.level }}'
          --changes '${{ needs.changes.result }}'
          --common '${{ needs.common.result }}'
          --tooling '${{ needs.tooling.result }}'
          --target '${{ needs.target.result }}'
