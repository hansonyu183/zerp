name: Documentation

on:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
        env:
          DOCS_USE_CASE_MISSING_BASELINE_BASE: ${{ github.event.pull_request.base.sha }}
