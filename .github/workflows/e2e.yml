name: Isolated full-stack E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: fullstack-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e_evidence:
    name: e2e-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reject stacked pull requests
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ZERP_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ZERP_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ZERP_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/verify-pr-base.sh
      - name: Reuse merged PR result
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-merged-pr.sh
      - name: Validate merge-time Compose shape
        if: github.event_name == 'push'
        run: |
          docker compose --env-file backend/.env.e2e.example \
            -p zerp-fullstack-e2e \
            -f compose.yaml -f compose.e2e.yaml config --quiet

  e2e_shard:
    name: e2e-${{ matrix.project }}
    if: github.event_name != 'push'
    needs: e2e_evidence
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            cache_writer: true
          - project: mobile-chromium
            cache_writer: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @zerp/frontend exec playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v4
      - name: Build and update cached E2E backend image
        if: matrix.cache_writer
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: zerp-e2e-api:${{ github.sha }}
          cache-from: type=gha,scope=zerp-e2e-backend
          cache-to: type=gha,mode=max,scope=zerp-e2e-backend
      - name: Build E2E backend image from cache
        if: ${{ !matrix.cache_writer }}
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: zerp-e2e-api:${{ github.sha }}
          cache-from: type=gha,scope=zerp-e2e-backend
      - name: Build and update cached E2E web image
        if: matrix.cache_writer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: zerp-e2e-web:${{ github.sha }}
          cache-from: type=gha,scope=zerp-e2e-web
          cache-to: type=gha,mode=max,scope=zerp-e2e-web
      - name: Build E2E web image from cache
        if: ${{ !matrix.cache_writer }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: zerp-e2e-web:${{ github.sha }}
          cache-from: type=gha,scope=zerp-e2e-web
      - name: Run self-contained full-stack E2E
        env:
          E2E_SKIP_IMAGE_BUILD: '1'
          E2E_PLAYWRIGHT_PROJECT: ${{ matrix.project }}
          ZERP_API_IMAGE: zerp-e2e-api:${{ github.sha }}
          ZERP_WEB_IMAGE: zerp-e2e-web:${{ github.sha }}
        run: make e2e

  e2e:
    name: e2e
    if: always()
    needs:
      - e2e_evidence
      - e2e_shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful E2E evidence and shards
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVIDENCE_RESULT: ${{ needs.e2e_evidence.result }}
          SHARD_RESULT: ${{ needs.e2e_shard.result }}
        run: |
          test "$EVIDENCE_RESULT" = "success"
          if [ "$EVENT_NAME" != "push" ]; then
            test "$SHARD_RESULT" = "success"
          fi
