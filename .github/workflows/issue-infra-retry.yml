name: Issue infrastructure retry

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-infrastructure-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: implementer_token
        with:
          app-id: ${{ vars.ZERP_IMPLEMENTER_APP_ID }}
          private-key: ${{ secrets.ZERP_IMPLEMENTER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Retry bounded infrastructure failures
        env:
          GH_TOKEN: ${{ steps.implementer_token.outputs.token }}
          ZERP_AUTOMATION_ENABLED: ${{ vars.ZERP_AUTOMATION_ENABLED }}
        run: scripts/issue-infra-retry.sh
