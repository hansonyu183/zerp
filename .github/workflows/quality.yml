name: Full-stack quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge_evidence:
    name: merge-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      impact: ${{ steps.change_impact.outputs.impact }}
      contracts: ${{ steps.change_impact.outputs.contracts }}
      frontend: ${{ steps.change_impact.outputs.frontend }}
      frontend_audit: ${{ steps.change_impact.outputs.frontend_audit }}
      backend: ${{ steps.change_impact.outputs.backend }}
      containers: ${{ steps.change_impact.outputs.containers }}
      e2e: ${{ steps.change_impact.outputs.e2e }}
      local_e2e: ${{ steps.change_impact.outputs.local_e2e }}
      preview: ${{ steps.change_impact.outputs.preview }}
      full_validation: ${{ steps.change_impact.outputs.full_validation }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Classify change checks
        id: change_impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            checks=$(scripts/change-impact.sh --checks "$BASE_SHA...$HEAD_SHA")
          else
            checks='impact=application
          contracts=1
          frontend=1
          frontend_audit=1
          backend=1
          containers=1
          e2e=1
          local_e2e=1
          preview=1'
          fi
          impact=$(printf '%s\n' "$checks" | sed -n 's/^impact=//p')
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_DRAFT" = "true" ] && \
            [ "$impact" = "application" ]; then
            full_validation=0
          else
            full_validation=1
          fi
          checks="${checks}
          full_validation=${full_validation}"
          printf '%s\n' "$checks"
          printf '%s\n' "$checks" >> "$GITHUB_OUTPUT"
          {
            echo '### Validation plan'
            echo '```text'
            printf '%s\n' "$checks"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Reject stacked pull requests
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ZERP_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ZERP_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ZERP_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: scripts/verify-pr-base.sh
      - name: Reuse merged PR checks
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          ZERP_MERGED_BASE_REF: ${{ github.ref_name }}
        run: scripts/verify-merged-pr.sh

  contracts:
    needs: merge_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        if: github.event_name != 'push'
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        if: github.event_name != 'push'
      - uses: actions/setup-node@v6
        if: github.event_name != 'push'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v6
        if: >-
          github.event_name != 'push' &&
          (needs.merge_evidence.outputs.contracts == '1' ||
          needs.merge_evidence.outputs.impact == 'validation')
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum
      - if: github.event_name != 'push'
        run: pnpm install --frozen-lockfile
      - name: Generate contracts and reject drift
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.contracts == '1'
        run: |
          make generate
          git diff --exit-code -- \
            contracts/openapi/dist \
            backend/internal/api/generated \
            backend/internal/database/sqlc \
            frontend/src/api/generated
      - name: Check documentation, formatting and whitespace
        if: github.event_name != 'push'
        run: |
          pnpm docs:check
          pnpm format:check
          git diff --check
      - name: Validate development tooling
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.impact == 'validation'
        run: scripts/validation-check.sh
      - name: Reuse successful PR contracts check
        if: github.event_name == 'push'
        run: echo "Reused merged PR contracts result"

  frontend:
    needs: merge_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.frontend == '1'
      - uses: pnpm/action-setup@v6
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.frontend == '1'
      - uses: actions/setup-node@v6
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.frontend == '1'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.frontend == '1'
        run: pnpm install --frozen-lockfile
      - name: Run frontend quality gate
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.frontend == '1'
        run: pnpm --filter @zerp/frontend check:core
      - name: Verify Cloudflare Pages compatibility build
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.frontend == '1'
        run: |
          test -f frontend/dist/index.html
          test "$(cat frontend/dist/_zerp-release)" = "$GITHUB_SHA"
      - name: Audit production dependencies
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.frontend_audit == '1'
        run: pnpm audit --prod
      - name: Skip frontend gate
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.frontend != '1'
        run: echo "No frontend impact"
      - name: Reuse successful PR frontend check
        if: github.event_name == 'push'
        run: echo "Reused merged PR frontend result"

  backend_test:
    name: backend-test
    if: >-
      github.event_name != 'push' &&
      needs.merge_evidence.outputs.backend == '1' &&
      needs.merge_evidence.outputs.full_validation == '1'
    needs: merge_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum
      - name: Prepare isolated backend test environment
        run: |
          install -m 600 /dev/null backend/.env.ci
          {
            echo 'APP_ENV=test'
            echo 'POSTGRES_DB=zerp'
            echo 'POSTGRES_USER=zerp'
            echo 'POSTGRES_PASSWORD=ci-only-password'
            echo 'POSTGRES_PORT=5432'
            echo 'DATABASE_URL=postgres://zerp:ci-only-password@localhost:5432/zerp?sslmode=disable'
            echo 'TEST_POSTGRES_DB=zerp_test'
            echo 'TEST_POSTGRES_PORT=55434'
            echo 'ATTACHMENT_STORAGE_ROOT=./var/attachments'
            echo 'FEEDBACK_GITHUB_ENABLED=false'
          } >> backend/.env.ci
      - name: Run integration, vet, build and race gates
        run: |
          make -C backend ENV_FILE=.env.ci quality-test
          make -C backend quality-vet-build quality-race

  backend_static:
    name: backend-static
    if: >-
      github.event_name != 'push' &&
      needs.merge_evidence.outputs.backend == '1'
    needs: merge_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum
      - name: Run backend formatting, static and security gates
        run: make -C backend quality-format quality-staticcheck quality-vuln

  backend:
    name: backend
    if: always()
    needs:
      - merge_evidence
      - backend_test
      - backend_static
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful backend gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          BACKEND_REQUIRED: ${{ needs.merge_evidence.outputs.backend }}
          FULL_VALIDATION: ${{ needs.merge_evidence.outputs.full_validation }}
          EVIDENCE_RESULT: ${{ needs.merge_evidence.result }}
          TEST_RESULT: ${{ needs.backend_test.result }}
          STATIC_RESULT: ${{ needs.backend_static.result }}
        run: |
          test "$EVIDENCE_RESULT" = "success"
          if [ "$EVENT_NAME" != "push" ] && [ "$BACKEND_REQUIRED" = "1" ]; then
            test "$STATIC_RESULT" = "success"
            if [ "$FULL_VALIDATION" = "1" ]; then
              test "$TEST_RESULT" = "success"
            else
              test "$TEST_RESULT" = "skipped"
            fi
          fi
      - name: Reuse successful PR backend check
        if: github.event_name == 'push'
        run: echo "Reused merged PR backend result"

  containers:
    needs: merge_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.containers == '1'
        with:
          fetch-depth: 0
      - name: Validate container and release configuration
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.containers == '1'
        run: |
          make check-runtime BACKEND_ENV=.env.example
      - name: Skip container gate
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.containers != '1'
        run: echo "No container impact"
      - name: Reuse successful PR containers check
        if: github.event_name == 'push'
        run: echo "Reused merged PR containers result"

  e2e:
    name: e2e
    needs: merge_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
      - uses: pnpm/action-setup@v6
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
      - uses: actions/setup-node@v6
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium once
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
        run: pnpm --filter @zerp/frontend exec playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v4
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
      - name: Build and cache E2E backend image once
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile.ci
          load: true
          tags: zerp-e2e-api:${{ github.sha }}
          cache-from: type=gha,scope=zerp-e2e-backend
          cache-to: type=gha,mode=max,scope=zerp-e2e-backend
      - name: Build and cache E2E web image once
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: zerp-e2e-web:${{ github.sha }}
          cache-from: type=gha,scope=zerp-e2e-web
          cache-to: type=gha,mode=max,scope=zerp-e2e-web
      - name: Run desktop and mobile against one full stack
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
        env:
          E2E_SKIP_IMAGE_BUILD: '1'
          ZERP_API_IMAGE: zerp-e2e-api:${{ github.sha }}
          ZERP_WEB_IMAGE: zerp-e2e-web:${{ github.sha }}
        run: make e2e
      - name: Upload Playwright failure evidence
        if: >-
          failure() &&
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.sha }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn
          retention-days: 14
      - name: Skip E2E gate
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e != '1'
        run: echo "No E2E impact"
      - name: Defer full E2E for draft pull request
        if: >-
          github.event_name == 'pull_request' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation != '1'
        run: |
          echo "Draft pull request; full E2E runs when the PR is ready for review"
      - name: Reuse successful PR E2E check
        if: github.event_name == 'push'
        run: echo "Reused merged PR E2E result"

  full_validation:
    name: full-validation
    if: always()
    needs:
      - merge_evidence
      - contracts
      - frontend
      - backend
      - containers
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require ready full validation
        env:
          FULL_VALIDATION: ${{ needs.merge_evidence.outputs.full_validation }}
          EVIDENCE_RESULT: ${{ needs.merge_evidence.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$EVIDENCE_RESULT" = "success"
          if [ "$FULL_VALIDATION" != "1" ]; then
            echo "Draft application pull request: mark it ready to run and satisfy full validation" >&2
            exit 1
          fi
          test "$CONTRACTS_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$CONTAINERS_RESULT" = "success"
          test "$E2E_RESULT" = "success"
