name: Full-stack quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge_evidence:
    name: merge-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      impact: ${{ steps.change_impact.outputs.impact }}
      contracts: ${{ steps.change_impact.outputs.contracts }}
      frontend: ${{ steps.change_impact.outputs.frontend }}
      frontend_audit: ${{ steps.change_impact.outputs.frontend_audit }}
      frontend_full: ${{ steps.change_impact.outputs.frontend_full }}
      backend: ${{ steps.change_impact.outputs.backend }}
      backend_full: ${{ steps.change_impact.outputs.backend_full }}
      backend_deps: ${{ steps.change_impact.outputs.backend_deps }}
      containers: ${{ steps.change_impact.outputs.containers }}
      api_image: ${{ steps.change_impact.outputs.api_image }}
      web_image: ${{ steps.change_impact.outputs.web_image }}
      e2e: ${{ steps.change_impact.outputs.e2e }}
      local_e2e: ${{ steps.change_impact.outputs.local_e2e }}
      preview: ${{ steps.change_impact.outputs.preview }}
      full_validation: ${{ steps.change_impact.outputs.full_validation }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Classify change checks
        id: change_impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$PR_BASE_REF" = "main" ]; then
              diff_range="$BASE_SHA..$HEAD_SHA"
            else
              diff_range="$BASE_SHA...$HEAD_SHA"
            fi
            checks=$(scripts/change-impact.sh --checks "$diff_range")
            if [ "$PR_BASE_REF" = "main" ]; then
              checks=$(printf '%s\n' "$checks" | sed \
                -e 's/^frontend_full=.*/frontend_full=1/' \
                -e 's/^containers=.*/containers=1/' \
                -e 's/^api_image=.*/api_image=1/' \
                -e 's/^web_image=.*/web_image=1/')
            fi
          else
            checks='impact=application
          contracts=1
          frontend=1
          frontend_audit=1
          frontend_full=1
          backend=1
          backend_full=1
          backend_deps=1
          containers=1
          api_image=1
          web_image=1
          e2e=1
          local_e2e=1
          preview=1'
          fi
          impact=$(printf '%s\n' "$checks" | sed -n 's/^impact=//p')
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_DRAFT" = "true" ] && \
            [ "$impact" = "application" ]; then
            full_validation=0
          else
            full_validation=1
          fi
          checks="${checks}
          full_validation=${full_validation}"
          printf '%s\n' "$checks"
          printf '%s\n' "$checks" >> "$GITHUB_OUTPUT"
          {
            echo '### Validation plan'
            echo '```text'
            printf '%s\n' "$checks"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Reject stacked pull requests
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ZERP_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ZERP_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ZERP_PR_NUMBER: ${{ github.event.pull_request.number }}
          ZERP_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: scripts/verify-pr-base.sh
      - name: Reuse merged PR checks
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          ZERP_MERGED_BASE_REF: ${{ github.ref_name }}
        run: scripts/verify-merged-pr.sh

  contracts:
    needs: merge_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        if: github.event_name != 'push'
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        if: github.event_name != 'push'
      - uses: actions/setup-node@v6
        if: github.event_name != 'push'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v6
        if: >-
          github.event_name != 'push' &&
          (needs.merge_evidence.outputs.contracts == '1' ||
          needs.merge_evidence.outputs.impact == 'validation')
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum
      - if: github.event_name != 'push'
        run: pnpm install --frozen-lockfile
      - name: Generate contracts and reject drift
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.contracts == '1'
        run: |
          make generate
          git diff --exit-code -- \
            contracts/openapi/dist \
            backend/internal/api/generated \
            backend/internal/database/sqlc \
            frontend/src/api/generated
      - name: Check documentation, formatting and whitespace
        if: github.event_name != 'push'
        run: |
          pnpm docs:check
          pnpm format:check
          git diff --check
      - name: Validate development tooling
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.impact == 'validation'
        run: scripts/validation-check.sh
      - name: Reuse successful PR contracts check
        if: github.event_name == 'push'
        run: echo "Reused merged PR contracts result"

  frontend:
    needs: merge_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.frontend == '1'
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.frontend == '1'
      - uses: actions/setup-node@v6
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.frontend == '1'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.frontend == '1'
        run: pnpm install --frozen-lockfile
      - name: Run frontend quality gate
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.frontend == '1'
        env:
          FULL_VALIDATION: ${{ needs.merge_evidence.outputs.full_validation }}
          FRONTEND_FULL: ${{ needs.merge_evidence.outputs.frontend_full }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$FULL_VALIDATION" = "1" ] || [ "$FRONTEND_FULL" = "1" ]; then
            pnpm --filter @zerp/frontend check:core
          else
            pnpm --filter @zerp/frontend lint
            pnpm --filter @zerp/frontend format:check
            pnpm --filter @zerp/frontend check:deployment-config
            mapfile -t changed_files < <(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
              frontend/src frontend/tests/unit | sed -n 's#^frontend/##p')
            if [ "${#changed_files[@]}" -gt 0 ]; then
              pnpm --dir frontend exec vitest related --run "${changed_files[@]}"
            else
              pnpm --filter @zerp/frontend test:unit
            fi
            pnpm --filter @zerp/frontend build
          fi
      - name: Verify Cloudflare Pages compatibility build
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.frontend == '1'
        run: |
          test -f frontend/dist/index.html
          test "$(cat frontend/dist/_zerp-release)" = "$GITHUB_SHA"
      - name: Audit production dependencies
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.frontend_audit == '1'
        run: pnpm audit --prod
      - name: Skip frontend gate
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.frontend != '1'
        run: echo "No frontend impact"
      - name: Reuse successful PR frontend check
        if: github.event_name == 'push'
        run: echo "Reused merged PR frontend result"

  backend_test:
    name: backend-test
    if: >-
      github.event_name != 'push' &&
      needs.merge_evidence.outputs.backend == '1'
    needs: merge_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum
      - name: Prepare isolated backend test environment
        if: needs.merge_evidence.outputs.backend_full == '1'
        run: |
          install -m 600 /dev/null backend/.env.ci
          {
            echo 'APP_ENV=test'
            echo 'POSTGRES_DB=zerp'
            echo 'POSTGRES_USER=zerp'
            echo 'POSTGRES_PASSWORD=ci-only-password'
            echo 'POSTGRES_PORT=5432'
            echo 'DATABASE_URL=postgres://zerp:ci-only-password@localhost:5432/zerp?sslmode=disable'
            echo 'TEST_POSTGRES_DB=zerp_test'
            echo 'TEST_POSTGRES_PORT=55434'
            echo 'ATTACHMENT_STORAGE_ROOT=./var/attachments'
            echo 'FEEDBACK_GITHUB_ENABLED=false'
          } >> backend/.env.ci
      - name: Run focused or full backend gates
        env:
          BACKEND_FULL: ${{ needs.merge_evidence.outputs.backend_full }}
          FULL_VALIDATION: ${{ needs.merge_evidence.outputs.full_validation }}
        run: |
          if [ "$BACKEND_FULL" = "1" ] && [ "$FULL_VALIDATION" = "1" ]; then
            make -C backend ENV_FILE=.env.ci quality-test
            make -C backend quality-vet-build
          else
            make -C backend quality-fast
          fi

  backend_race:
    name: backend-race
    if: >-
      github.event_name != 'push' &&
      needs.merge_evidence.outputs.backend == '1' &&
      needs.merge_evidence.outputs.backend_full == '1' &&
      needs.merge_evidence.outputs.full_validation == '1'
    needs: merge_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run backend race and coverage gate
        run: make -C backend quality-race

  backend_static:
    name: backend-static
    if: >-
      github.event_name != 'push' &&
      needs.merge_evidence.outputs.backend == '1'
    needs: merge_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum
      - name: Run backend formatting, static and security gates
        env:
          BACKEND_DEPS: ${{ needs.merge_evidence.outputs.backend_deps }}
        run: |
          make -C backend quality-format-fast
          if [ "$BACKEND_DEPS" = "1" ]; then
            make -C backend quality-modules
          fi
          make -C backend quality-staticcheck quality-vuln

  backend:
    name: backend
    if: always()
    needs:
      - merge_evidence
      - backend_test
      - backend_race
      - backend_static
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful backend gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          BACKEND_REQUIRED: ${{ needs.merge_evidence.outputs.backend }}
          FULL_VALIDATION: ${{ needs.merge_evidence.outputs.full_validation }}
          BACKEND_FULL: ${{ needs.merge_evidence.outputs.backend_full }}
          EVIDENCE_RESULT: ${{ needs.merge_evidence.result }}
          TEST_RESULT: ${{ needs.backend_test.result }}
          RACE_RESULT: ${{ needs.backend_race.result }}
          STATIC_RESULT: ${{ needs.backend_static.result }}
        run: |
          test "$EVIDENCE_RESULT" = "success"
          if [ "$EVENT_NAME" != "push" ] && [ "$BACKEND_REQUIRED" = "1" ]; then
            test "$TEST_RESULT" = "success"
            test "$STATIC_RESULT" = "success"
            if [ "$FULL_VALIDATION" = "1" ]; then
              if [ "$BACKEND_FULL" = "1" ]; then
                test "$RACE_RESULT" = "success"
              else
                test "$RACE_RESULT" = "skipped"
              fi
            else
              test "$RACE_RESULT" = "skipped"
            fi
          fi
      - name: Reuse successful PR backend check
        if: github.event_name == 'push'
        run: echo "Reused merged PR backend result"

  container_config:
    name: container-config
    needs: merge_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.containers == '1'
        with:
          fetch-depth: 0
      - name: Validate container and release configuration
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.containers == '1'
        run: |
          make check-runtime BACKEND_ENV=.env.example
      - name: Skip container gate
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.containers != '1'
        run: echo "No container impact"
      - name: Reuse successful PR containers check
        if: github.event_name == 'push'
        run: echo "Reused merged PR containers result"

  api_image:
    name: api-image
    if: >-
      github.event_name != 'push' &&
      needs.merge_evidence.outputs.api_image == '1' &&
      needs.merge_evidence.outputs.full_validation == '1'
    needs: merge_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=zerp-api-image
          cache-to: type=gha,mode=max,scope=zerp-api-image

  web_image:
    name: web-image
    if: >-
      github.event_name != 'push' &&
      needs.merge_evidence.outputs.web_image == '1' &&
      needs.merge_evidence.outputs.full_validation == '1'
    needs: merge_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=zerp-web-image
          cache-to: type=gha,mode=max,scope=zerp-web-image

  containers:
    name: containers
    if: always()
    needs:
      - merge_evidence
      - container_config
      - api_image
      - web_image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require relevant container gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_VALIDATION: ${{ needs.merge_evidence.outputs.full_validation }}
          API_IMAGE_REQUIRED: ${{ needs.merge_evidence.outputs.api_image }}
          WEB_IMAGE_REQUIRED: ${{ needs.merge_evidence.outputs.web_image }}
          EVIDENCE_RESULT: ${{ needs.merge_evidence.result }}
          CONFIG_RESULT: ${{ needs.container_config.result }}
          API_IMAGE_RESULT: ${{ needs.api_image.result }}
          WEB_IMAGE_RESULT: ${{ needs.web_image.result }}
        run: |
          test "$EVIDENCE_RESULT" = "success"
          test "$CONFIG_RESULT" = "success"
          if [ "$EVENT_NAME" != "push" ] && [ "$FULL_VALIDATION" = "1" ]; then
            if [ "$API_IMAGE_REQUIRED" = "1" ]; then
              test "$API_IMAGE_RESULT" = "success"
            else
              test "$API_IMAGE_RESULT" = "skipped"
            fi
            if [ "$WEB_IMAGE_REQUIRED" = "1" ]; then
              test "$WEB_IMAGE_RESULT" = "success"
            else
              test "$WEB_IMAGE_RESULT" = "skipped"
            fi
          else
            test "$API_IMAGE_RESULT" = "skipped"
            test "$WEB_IMAGE_RESULT" = "skipped"
          fi

  e2e:
    name: e2e
    needs: merge_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
      - uses: pnpm/action-setup@v6
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
      - uses: actions/setup-node@v6
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v6
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum
      - if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright Chromium
        id: playwright-cache
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium system dependencies
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
        run: pnpm --filter @zerp/frontend exec playwright install-deps chromium
      - name: Install Chromium
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1' &&
          steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @zerp/frontend exec playwright install chromium
      - name: Run desktop and mobile against one full stack
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
        run: make e2e
      - name: Upload Playwright failure evidence
        if: >-
          failure() &&
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation == '1'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.sha }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn
          retention-days: 14
      - name: Skip E2E gate
        if: >-
          github.event_name != 'push' &&
          needs.merge_evidence.outputs.e2e != '1'
        run: echo "No E2E impact"
      - name: Defer full E2E for draft pull request
        if: >-
          github.event_name == 'pull_request' &&
          needs.merge_evidence.outputs.e2e == '1' &&
          needs.merge_evidence.outputs.full_validation != '1'
        run: |
          echo "Draft pull request; full E2E runs when the PR is ready for review"
      - name: Reuse successful PR E2E check
        if: github.event_name == 'push'
        run: echo "Reused merged PR E2E result"

  full_validation:
    name: full-validation
    if: always()
    needs:
      - merge_evidence
      - contracts
      - frontend
      - backend
      - containers
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require ready full validation
        env:
          FULL_VALIDATION: ${{ needs.merge_evidence.outputs.full_validation }}
          EVIDENCE_RESULT: ${{ needs.merge_evidence.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$EVIDENCE_RESULT" = "success"
          if [ "$FULL_VALIDATION" != "1" ]; then
            echo "Draft application pull request: mark it ready to run and satisfy full validation" >&2
            exit 1
          fi
          test "$CONTRACTS_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$CONTAINERS_RESULT" = "success"
          test "$E2E_RESULT" = "success"
