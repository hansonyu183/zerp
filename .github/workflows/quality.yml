name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Prepare isolated test environment
        shell: bash
        run: |
          install -m 600 /dev/null .env.ci
          {
            echo 'APP_ENV=test'
            echo 'POSTGRES_DB=zerp'
            echo 'POSTGRES_USER=zerp'
            echo 'POSTGRES_PASSWORD=ci-only-password'
            echo 'POSTGRES_PORT=5432'
            echo 'DATABASE_URL=postgres://zerp:ci-only-password@localhost:5432/zerp?sslmode=disable'
            echo 'TEST_POSTGRES_DB=zerp_test'
            echo 'TEST_DATABASE_URL=postgres://zerp:ci-only-password@localhost:5432/zerp_test?sslmode=disable'
            echo 'PGADMIN_DEFAULT_EMAIL=ci@example.com'
            echo 'PGADMIN_PASSWORD_FILE=/tmp/zerp-pgadmin-password'
            echo 'PGADMIN_PGPASS_FILE=/tmp/zerp-pgpass'
            echo 'ATTACHMENT_STORAGE_ROOT=./var/attachments'
            echo 'FEEDBACK_GITHUB_ENABLED=false'
          } >> .env.ci
          printf '%s\n' 'ci-only-password' > /tmp/zerp-pgadmin-password
          printf '%s\n' 'db:5432:*:zerp:ci-only-password' > /tmp/zerp-pgpass
          chmod 600 /tmp/zerp-pgadmin-password /tmp/zerp-pgpass

      - name: Verify generated code
        run: |
          make ENV_FILE=.env.ci generate
          git diff --exit-code

      - name: Verify formatting and module metadata
        shell: bash
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go mod tidy -diff
          go mod verify
          git diff --check

      - name: Run tests
        run: make ENV_FILE=.env.ci test

      - name: Run vet and build
        run: |
          go vet ./...
          go build ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Build container image
        run: docker build --tag zerp-back:ci .
