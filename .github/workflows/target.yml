name: Target

on:
  workflow_call:
    inputs:
      full:
        description: Run the complete runtime acceptance suite
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  target:
    name: target
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v6
        if: ${{ inputs.full }}
        with:
          go-version-file: packages/wfl-starlark/go/go.mod
          cache-dependency-path: packages/wfl-starlark/go/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Draft static, unit and component checks
        if: ${{ !inputs.full }}
        run: make target-static test
      - name: Install browser for full acceptance
        if: ${{ inputs.full }}
        run: pnpm --filter @zerp/frontend exec playwright install --with-deps chromium
      - name: Full runtime acceptance
        if: ${{ inputs.full }}
        run: TARGET_POSTGRES_PASSWORD=zerp-target-ci make target-e2e
      - name: Clean disposable target resources
        if: ${{ always() && inputs.full }}
        run: TARGET_POSTGRES_PASSWORD=zerp-target-ci make target-down
