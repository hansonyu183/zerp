services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"

  api:
    environment:
      APP_ENV: test
      APP_SESSION_COOKIE_SECURE: "false"
      APP_SESSION_COOKIE_SAME_SITE: lax
      FEEDBACK_GITHUB_ENABLED: "false"
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"

  web:
    ports:
      - "127.0.0.1:${E2E_WEB_PORT:-15173}:8080"

  pgadmin:
    profiles: ["never"]
