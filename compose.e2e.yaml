name: zerp-back-e2e

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.e2e.local}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.e2e.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.e2e.local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?set POSTGRES_PORT in .env.e2e.local}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    labels:
      com.zerp.environment: e2e

  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      APP_ENV: test
      HTTP_ADDRESS: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER in .env.e2e.local}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.e2e.local}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env.e2e.local}?sslmode=disable
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env.e2e.local}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-5s}
      DATABASE_HEALTH_TIMEOUT: ${DATABASE_HEALTH_TIMEOUT:-2s}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      APP_SESSION_COOKIE_NAME: ${APP_SESSION_COOKIE_NAME:-zerp_e2e_session}
      APP_SESSION_COOKIE_SECURE: ${APP_SESSION_COOKIE_SECURE:-false}
      APP_SESSION_COOKIE_SAME_SITE: ${APP_SESSION_COOKIE_SAME_SITE:-lax}
      APP_SESSION_IDLE_TIMEOUT: ${APP_SESSION_IDLE_TIMEOUT:-30m}
      APP_SESSION_ABSOLUTE_TIMEOUT: ${APP_SESSION_ABSOLUTE_TIMEOUT:-12h}
      APP_SIGNIN_LOCK_THRESHOLD: ${APP_SIGNIN_LOCK_THRESHOLD:-5}
      APP_SIGNIN_LOCK_DURATION: ${APP_SIGNIN_LOCK_DURATION:-15m}
      APP_PASSWORD_MIN_LENGTH: ${APP_PASSWORD_MIN_LENGTH:-12}
      ATTACHMENT_STORAGE_ROOT: /var/lib/zerp/attachments
      ATTACHMENT_UPLOAD_TOKEN_TTL: ${ATTACHMENT_UPLOAD_TOKEN_TTL:-15m}
      ATTACHMENT_DOWNLOAD_TOKEN_TTL: ${ATTACHMENT_DOWNLOAD_TOKEN_TTL:-5m}
      FEEDBACK_ATTACHMENT_ORPHAN_TTL: ${FEEDBACK_ATTACHMENT_ORPHAN_TTL:-24h}
      FEEDBACK_GITHUB_ENABLED: "false"
    ports:
      - "127.0.0.1:${API_PORT:?set API_PORT in .env.e2e.local}:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - attachment-data:/var/lib/zerp/attachments
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      com.zerp.environment: e2e

volumes:
  postgres-data:
  attachment-data:
