services:
  db:
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55436}:5432'

  api:
    environment:
      APP_ENV: development
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env.preview.local}
      APP_SESSION_COOKIE_NAME: ${APP_SESSION_COOKIE_NAME:-zerp_preview_session}
      APP_SESSION_COOKIE_SECURE: 'true'
      APP_SESSION_COOKIE_SAME_SITE: lax
      APP_BOOTSTRAP_USERNAME: ${APP_BOOTSTRAP_USERNAME:?set APP_BOOTSTRAP_USERNAME}
      APP_BOOTSTRAP_DISPLAY_NAME: ${APP_BOOTSTRAP_DISPLAY_NAME:?set APP_BOOTSTRAP_DISPLAY_NAME}
      APP_BOOTSTRAP_PASSWORD: ${APP_BOOTSTRAP_PASSWORD:?set APP_BOOTSTRAP_PASSWORD}
      FEEDBACK_GITHUB_ENABLED: 'false'
    ports:
      - '127.0.0.1:${API_PORT:-18082}:8080'
    labels:
      io.zerp.release: ${ZERP_RELEASE_SHA:-workspace}

  web:
    ports:
      - '127.0.0.1:${WEB_PORT:-15176}:8080'
    labels:
      io.zerp.release: ${ZERP_RELEASE_SHA:-workspace}

  pgadmin:
    profiles: ['never']
