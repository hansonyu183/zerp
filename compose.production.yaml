services:
  db:
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'

  api:
    image: ${ZERP_API_IMAGE:?set ZERP_API_IMAGE}
    build: !reset null
    environment:
      TARGET_DATABASE_SCOPE: production
      APP_SESSION_COOKIE_SECURE: 'true'
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    depends_on:
      admin-initialize:
        condition: service_completed_successfully
    labels:
      io.zerp.release: ${ZERP_RELEASE_SHA:?set ZERP_RELEASE_SHA}

  catalog-sync:
    image: ${ZERP_API_IMAGE:?set ZERP_API_IMAGE}
    build: !reset null
    labels:
      io.zerp.release: ${ZERP_RELEASE_SHA:?set ZERP_RELEASE_SHA}

  admin-initialize:
    image: ${ZERP_API_IMAGE:?set ZERP_API_IMAGE}
    build: !reset null
    restart: 'no'
    command: ['pnpm', 'initialize:admin']
    environment:
      TARGET_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      TARGET_DATABASE_SCOPE: production
      APP_PASSWORD_MIN_LENGTH: ${APP_PASSWORD_MIN_LENGTH:-12}
      APP_ADMIN_1_USERNAME: ${APP_ADMIN_1_USERNAME:?set APP_ADMIN_1_USERNAME}
      APP_ADMIN_1_DISPLAY_NAME: ${APP_ADMIN_1_DISPLAY_NAME:?set APP_ADMIN_1_DISPLAY_NAME}
      APP_ADMIN_1_PASSWORD_FILE: /run/secrets/admin-1-password
      APP_ADMIN_2_USERNAME: ${APP_ADMIN_2_USERNAME:?set APP_ADMIN_2_USERNAME}
      APP_ADMIN_2_DISPLAY_NAME: ${APP_ADMIN_2_DISPLAY_NAME:?set APP_ADMIN_2_DISPLAY_NAME}
      APP_ADMIN_2_PASSWORD_FILE: /run/secrets/admin-2-password
    secrets:
      - admin-1-password
      - admin-2-password
    depends_on:
      catalog-sync:
        condition: service_completed_successfully
    labels:
      io.zerp.release: ${ZERP_RELEASE_SHA:?set ZERP_RELEASE_SHA}

  web:
    image: ${ZERP_WEB_IMAGE:?set ZERP_WEB_IMAGE}
    build: !reset null
    ports:
      - '127.0.0.1:${WEB_PORT:-8088}:80'
    labels:
      io.zerp.release: ${ZERP_RELEASE_SHA:?set ZERP_RELEASE_SHA}

secrets:
  admin-1-password:
    file: ${APP_ADMIN_1_PASSWORD_FILE:?set APP_ADMIN_1_PASSWORD_FILE}
  admin-2-password:
    file: ${APP_ADMIN_2_PASSWORD_FILE:?set APP_ADMIN_2_PASSWORD_FILE}
