services:
  db:
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'

  api:
    image: ${ZERP_API_IMAGE:?set ZERP_API_IMAGE}
    environment:
      APP_ENV: production
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      APP_SESSION_COOKIE_NAME: ${APP_SESSION_COOKIE_NAME:-zerp_session}
      APP_SESSION_COOKIE_SECURE: 'true'
      APP_SESSION_COOKIE_SAME_SITE: lax
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    labels:
      io.zerp.release: ${ZERP_RELEASE_SHA:?set ZERP_RELEASE_SHA}
