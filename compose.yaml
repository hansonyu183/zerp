name: zerp

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./apps/api/db/target-schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    image: ${ZERP_API_IMAGE:-zerp-target-api:workspace}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      TARGET_DATABASE_SCOPE: production
      HTTP_ADDRESS: 0.0.0.0:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      APP_SESSION_COOKIE_NAME: ${APP_SESSION_COOKIE_NAME:-zerp_session}
      APP_SESSION_COOKIE_SECURE: ${APP_SESSION_COOKIE_SECURE:-true}
      APP_SESSION_COOKIE_SAME_SITE: ${APP_SESSION_COOKIE_SAME_SITE:-lax}
      APP_SESSION_IDLE_TIMEOUT: ${APP_SESSION_IDLE_TIMEOUT:-30m}
      APP_SESSION_ABSOLUTE_TIMEOUT: ${APP_SESSION_ABSOLUTE_TIMEOUT:-12h}
      APP_PASSWORD_MIN_LENGTH: ${APP_PASSWORD_MIN_LENGTH:-12}
      HTTP_BODY_LIMIT_BYTES: ${HTTP_BODY_LIMIT_BYTES:-15728640}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      ATTACHMENT_STORAGE_ROOT: /var/lib/zerp/attachments
    volumes:
      - attachment-data:/var/lib/zerp/attachments
    depends_on:
      catalog-sync:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:8080/readyz\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  catalog-sync:
    image: ${ZERP_API_IMAGE:-zerp-target-api:workspace}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: 'no'
    command: ['pnpm', 'sync:catalog']
    environment:
      TARGET_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      TARGET_DATABASE_SCOPE: production
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${ZERP_WEB_IMAGE:-zerp-target-web:workspace}
    build:
      context: .
      dockerfile: frontend/Dockerfile.target
      args:
        VITE_TARGET_API_BASE_URL: ${TARGET_API_BROWSER_URL:-https://zerp-api.bytesucceed.com}
        GITHUB_SHA: ${ZERP_RELEASE_SHA:?set ZERP_RELEASE_SHA}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  attachment-data:
