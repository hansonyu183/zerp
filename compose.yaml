name: zerp

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    image: ${ZERP_API_IMAGE:-zerp-api:workspace}
    build:
      context: backend
    restart: 'no'
    entrypoint: ['/usr/local/bin/goose']
    command:
      [
        '-dir',
        '/app/migrations',
        'postgres',
        'postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable',
        'up',
      ]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${ZERP_API_IMAGE:-zerp-api:workspace}
    build:
      context: backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDRESS: ':8080'
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-5s}
      DATABASE_HEALTH_TIMEOUT: ${DATABASE_HEALTH_TIMEOUT:-2s}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-2m}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-2m}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      APP_SESSION_COOKIE_NAME: ${APP_SESSION_COOKIE_NAME:-zerp_session}
      APP_SESSION_COOKIE_SECURE: ${APP_SESSION_COOKIE_SECURE:-true}
      APP_SESSION_COOKIE_SAME_SITE: ${APP_SESSION_COOKIE_SAME_SITE:-lax}
      APP_SESSION_IDLE_TIMEOUT: ${APP_SESSION_IDLE_TIMEOUT:-30m}
      APP_SESSION_ABSOLUTE_TIMEOUT: ${APP_SESSION_ABSOLUTE_TIMEOUT:-12h}
      APP_SIGNIN_LOCK_THRESHOLD: ${APP_SIGNIN_LOCK_THRESHOLD:-5}
      APP_SIGNIN_LOCK_DURATION: ${APP_SIGNIN_LOCK_DURATION:-15m}
      APP_PASSWORD_MIN_LENGTH: ${APP_PASSWORD_MIN_LENGTH:-12}
      ATTACHMENT_STORAGE_ROOT: /var/lib/zerp/attachments
      ATTACHMENT_UPLOAD_TOKEN_TTL: ${ATTACHMENT_UPLOAD_TOKEN_TTL:-15m}
      ATTACHMENT_DOWNLOAD_TOKEN_TTL: ${ATTACHMENT_DOWNLOAD_TOKEN_TTL:-5m}
      FEEDBACK_ATTACHMENT_ORPHAN_TTL: ${FEEDBACK_ATTACHMENT_ORPHAN_TTL:-24h}
      FEEDBACK_GITHUB_ENABLED: ${FEEDBACK_GITHUB_ENABLED:-false}
      FEEDBACK_GITHUB_REPOSITORY: ${FEEDBACK_GITHUB_REPOSITORY:-hansonyu183/zerp}
      FEEDBACK_GITHUB_TOKEN: ${FEEDBACK_GITHUB_TOKEN:-}
    expose:
      - '8080'
    volumes:
      - attachment-data:/var/lib/zerp/attachments
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8080/readyz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    image: ${ZERP_WEB_IMAGE:-zerp-web:workspace}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-8088}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.16
    profiles: ['admin']
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.invalid}
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
      PGADMIN_DISABLE_POSTFIX: '1'
      PGADMIN_LISTEN_PORT: '5050'
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-5050}:5050'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    secrets:
      - pgadmin_password
    depends_on:
      db:
        condition: service_healthy

secrets:
  pgadmin_password:
    file: ${PGADMIN_PASSWORD_FILE:-backend/.pgadmin-password}

volumes:
  postgres-data:
  attachment-data:
  pgadmin-data:
