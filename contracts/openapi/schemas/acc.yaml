{
  'BookQueryRequest':
    {
      'type': 'object',
      'required': ['page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 200 },
          'keyword': { 'type': 'string', 'maxLength': 200 },
        },
    },
  'BookGetRequest':
    {
      'type': 'object',
      'required': ['bookId'],
      'additionalProperties': false,
      'properties':
        { 'bookId': { 'type': 'string', 'minLength': 26, 'maxLength': 26 } },
    },
  'BookCreateRequest':
    {
      'type': 'object',
      'required': ['name', 'startMonth', 'baseCurrency', 'subjectTemplate'],
      'additionalProperties': false,
      'properties':
        {
          'name': { 'type': 'string', 'minLength': 1, 'maxLength': 200 },
          'description': { 'type': 'string', 'maxLength': 1000 },
          'startMonth':
            { 'type': 'string', 'pattern': '^[0-9]{4}-(0[1-9]|1[0-2])$' },
          'baseCurrency': { 'type': 'string', 'pattern': '^[A-Za-z]{3}$' },
          'subjectTemplate': { '$ref': '#/SubjectTemplate' },
          'queryUserIds':
            {
              'type': 'array',
              'uniqueItems': true,
              'items': { 'type': 'string' },
            },
          'operateUserIds':
            {
              'type': 'array',
              'uniqueItems': true,
              'items': { 'type': 'string' },
            },
        },
    },
  'BookSaveRequest':
    {
      'type': 'object',
      'required': ['bookId', 'name', 'baseCurrency', 'revision'],
      'additionalProperties': false,
      'properties':
        {
          'bookId': { 'type': 'string', 'minLength': 26, 'maxLength': 26 },
          'name': { 'type': 'string', 'minLength': 1, 'maxLength': 200 },
          'description': { 'type': 'string', 'maxLength': 1000 },
          'baseCurrency': { 'type': 'string', 'pattern': '^[A-Za-z]{3}$' },
          'revision': { 'type': 'integer', 'format': 'int64', 'minimum': 1 },
          'queryUserIds':
            {
              'type': 'array',
              'uniqueItems': true,
              'items': { 'type': 'string' },
            },
          'operateUserIds':
            {
              'type': 'array',
              'uniqueItems': true,
              'items': { 'type': 'string' },
            },
        },
    },
  'BookDeleteRequest':
    {
      'type': 'object',
      'required': ['bookId', 'revision'],
      'additionalProperties': false,
      'properties':
        {
          'bookId': { 'type': 'string', 'minLength': 26, 'maxLength': 26 },
          'revision': { 'type': 'integer', 'format': 'int64', 'minimum': 1 },
        },
    },
  'Book':
    {
      'type': 'object',
      'required':
        [
          'bookId',
          'code',
          'name',
          'description',
          'startMonth',
          'baseCurrency',
          'subjectTemplate',
          'controlBook',
          'revision',
          'queryUserIds',
          'operateUserIds',
        ],
      'additionalProperties': false,
      'properties':
        {
          'bookId': { 'type': 'string' },
          'code': { 'type': 'string' },
          'name': { 'type': 'string' },
          'description': { 'type': 'string' },
          'startMonth': { 'type': 'string' },
          'baseCurrency': { 'type': 'string' },
          'subjectTemplate': { '$ref': '#/SubjectTemplate' },
          'controlBook': { 'type': 'boolean' },
          'revision': { 'type': 'integer', 'format': 'int64' },
          'queryUserIds': { 'type': 'array', 'items': { 'type': 'string' } },
          'operateUserIds': { 'type': 'array', 'items': { 'type': 'string' } },
        },
    },
  'SubjectTemplate':
    { 'type': 'string', 'enum': ['ENTERPRISE', 'SMALL_BUSINESS', 'EMPTY'] },
  'BalanceDirection': { 'type': 'string', 'enum': ['DEBIT', 'CREDIT'] },
  'SubjectDimension':
    {
      'type': 'string',
      'enum':
        [
          'CUSTOMER',
          'SUPPLIER',
          'OTHER_PARTY',
          'EMPLOYEE',
          'DEPARTMENT',
          'PRODUCT',
          'WAREHOUSE',
          'FUND_ACCOUNT',
          'ASSET',
          'BILL',
        ],
    },
  'SettlementPurpose':
    {
      'type': 'string',
      'enum':
        [
          'NONE',
          'RECEIVABLE',
          'PREPAID',
          'PAYABLE',
          'ADVANCE_RECEIPT',
          'OTHER',
        ],
    },
  'SubjectQueryRequest':
    {
      'type': 'object',
      'required': ['bookId', 'page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'bookId': { 'type': 'string', 'minLength': 26, 'maxLength': 26 },
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 200 },
          'keyword': { 'type': 'string', 'maxLength': 200 },
        },
    },
  'SubjectGetRequest':
    {
      'type': 'object',
      'required': ['bookId', 'subjectId'],
      'additionalProperties': false,
      'properties':
        {
          'bookId': { 'type': 'string', 'minLength': 26, 'maxLength': 26 },
          'subjectId': { 'type': 'string', 'minLength': 26, 'maxLength': 26 },
        },
    },
  'SubjectCreateRequest':
    {
      'type': 'object',
      'required':
        [
          'bookId',
          'code',
          'name',
          'balanceDirection',
          'enabled',
          'requiredDimensions',
          'inventoryQuantity',
          'settlementPurpose',
        ],
      'additionalProperties': false,
      'properties':
        {
          'bookId': { 'type': 'string', 'minLength': 26, 'maxLength': 26 },
          'code': { 'type': 'string', 'minLength': 1, 'maxLength': 32 },
          'name': { 'type': 'string', 'minLength': 1, 'maxLength': 200 },
          'parentSubjectId':
            {
              'type': 'string',
              'nullable': true,
              'minLength': 26,
              'maxLength': 26,
            },
          'balanceDirection': { '$ref': '#/BalanceDirection' },
          'enabled': { 'type': 'boolean' },
          'requiredDimensions':
            {
              'type': 'array',
              'uniqueItems': true,
              'items': { '$ref': '#/SubjectDimension' },
            },
          'inventoryQuantity': { 'type': 'boolean' },
          'settlementPurpose': { '$ref': '#/SettlementPurpose' },
        },
    },
  'SubjectSaveRequest':
    {
      'type': 'object',
      'required':
        [
          'bookId',
          'subjectId',
          'code',
          'name',
          'balanceDirection',
          'enabled',
          'requiredDimensions',
          'inventoryQuantity',
          'settlementPurpose',
          'revision',
        ],
      'additionalProperties': false,
      'properties':
        {
          'bookId': { 'type': 'string', 'minLength': 26, 'maxLength': 26 },
          'subjectId': { 'type': 'string', 'minLength': 26, 'maxLength': 26 },
          'code': { 'type': 'string', 'minLength': 1, 'maxLength': 32 },
          'name': { 'type': 'string', 'minLength': 1, 'maxLength': 200 },
          'parentSubjectId':
            {
              'type': 'string',
              'nullable': true,
              'minLength': 26,
              'maxLength': 26,
            },
          'balanceDirection': { '$ref': '#/BalanceDirection' },
          'enabled': { 'type': 'boolean' },
          'requiredDimensions':
            {
              'type': 'array',
              'uniqueItems': true,
              'items': { '$ref': '#/SubjectDimension' },
            },
          'inventoryQuantity': { 'type': 'boolean' },
          'settlementPurpose': { '$ref': '#/SettlementPurpose' },
          'revision': { 'type': 'integer', 'format': 'int64', 'minimum': 1 },
        },
    },
  'SubjectDeleteRequest':
    {
      'type': 'object',
      'required': ['bookId', 'subjectId', 'revision'],
      'additionalProperties': false,
      'properties':
        {
          'bookId': { 'type': 'string', 'minLength': 26, 'maxLength': 26 },
          'subjectId': { 'type': 'string', 'minLength': 26, 'maxLength': 26 },
          'revision': { 'type': 'integer', 'format': 'int64', 'minimum': 1 },
        },
    },
  'Subject':
    {
      'type': 'object',
      'required':
        [
          'subjectId',
          'bookId',
          'code',
          'name',
          'parentSubjectId',
          'balanceDirection',
          'enabled',
          'leaf',
          'requiredDimensions',
          'inventoryQuantity',
          'settlementPurpose',
          'referenced',
          'revision',
        ],
      'additionalProperties': false,
      'properties':
        {
          'subjectId': { 'type': 'string' },
          'bookId': { 'type': 'string' },
          'code': { 'type': 'string' },
          'name': { 'type': 'string' },
          'parentSubjectId': { 'type': 'string', 'nullable': true },
          'balanceDirection': { '$ref': '#/BalanceDirection' },
          'enabled': { 'type': 'boolean' },
          'leaf': { 'type': 'boolean' },
          'requiredDimensions':
            { 'type': 'array', 'items': { '$ref': '#/SubjectDimension' } },
          'inventoryQuantity': { 'type': 'boolean' },
          'settlementPurpose': { '$ref': '#/SettlementPurpose' },
          'referenced': { 'type': 'boolean' },
          'revision': { 'type': 'integer', 'format': 'int64' },
        },
    },
  'SubjectPage':
    {
      'type': 'object',
      'required': ['items', 'total', 'page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'items': { 'type': 'array', 'items': { '$ref': '#/Subject' } },
          'total': { 'type': 'integer', 'format': 'int64', 'minimum': 0 },
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1 },
        },
    },
  'SubjectEnvelope':
    {
      'type': 'object',
      'required': ['code', 'message', 'data', 'requestId'],
      'additionalProperties': false,
      'properties':
        {
          'code': { 'type': 'integer', 'format': 'int32' },
          'message': { 'type': 'string' },
          'data':
            {
              'type': 'object',
              'nullable': true,
              'allOf': [{ '$ref': '#/Subject' }],
            },
          'requestId': { 'type': 'string' },
        },
    },
  'SubjectPageEnvelope':
    {
      'type': 'object',
      'required': ['code', 'message', 'data', 'requestId'],
      'additionalProperties': false,
      'properties':
        {
          'code': { 'type': 'integer', 'format': 'int32' },
          'message': { 'type': 'string' },
          'data':
            {
              'type': 'object',
              'nullable': true,
              'allOf': [{ '$ref': '#/SubjectPage' }],
            },
          'requestId': { 'type': 'string' },
        },
    },
  'BookPage':
    {
      'type': 'object',
      'required': ['items', 'total', 'page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'items': { 'type': 'array', 'items': { '$ref': '#/Book' } },
          'total': { 'type': 'integer', 'format': 'int64', 'minimum': 0 },
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1 },
        },
    },
  'BookEnvelope':
    {
      'type': 'object',
      'required': ['code', 'message', 'data', 'requestId'],
      'additionalProperties': false,
      'properties':
        {
          'code': { 'type': 'integer', 'format': 'int32' },
          'message': { 'type': 'string' },
          'data':
            {
              'type': 'object',
              'nullable': true,
              'allOf': [{ '$ref': '#/Book' }],
            },
          'requestId': { 'type': 'string' },
        },
    },
  'BookPageEnvelope':
    {
      'type': 'object',
      'required': ['code', 'message', 'data', 'requestId'],
      'additionalProperties': false,
      'properties':
        {
          'code': { 'type': 'integer', 'format': 'int32' },
          'message': { 'type': 'string' },
          'data':
            {
              'type': 'object',
              'nullable': true,
              'allOf': [{ '$ref': '#/BookPage' }],
            },
          'requestId': { 'type': 'string' },
        },
    },
}
