{
  'SignInRequest':
    {
      'type': 'object',
      'required': ['username', 'password'],
      'additionalProperties': false,
      'properties':
        {
          'username': { 'type': 'string', 'minLength': 1, 'maxLength': 64 },
          'password': { 'type': 'string', 'minLength': 1, 'maxLength': 1024 },
        },
    },
  'ProfileRequest':
    {
      'type': 'object',
      'additionalProperties': false,
      'properties':
        {
          'displayName': { 'type': 'string', 'minLength': 1, 'maxLength': 128 },
          'avatarUrl':
            { 'type': 'string', 'nullable': true, 'maxLength': 2048 },
        },
    },
  'ChangePasswordRequest':
    {
      'type': 'object',
      'required': ['currentPassword', 'newPassword'],
      'additionalProperties': false,
      'properties':
        {
          'currentPassword': { 'type': 'string' },
          'newPassword': { 'type': 'string' },
        },
    },
  'CreateUserRequest':
    {
      'type': 'object',
      'required': ['username', 'displayName', 'password', 'roleIds'],
      'additionalProperties': false,
      'properties':
        {
          'username': { 'type': 'string' },
          'displayName': { 'type': 'string' },
          'password': { 'type': 'string' },
          'roleIds': { 'type': 'array', 'items': { 'type': 'string' } },
        },
    },
  'SaveUserRequest':
    {
      'type': 'object',
      'required': ['id', 'displayName', 'roleIds', 'revision'],
      'additionalProperties': false,
      'properties':
        {
          'id': { 'type': 'string' },
          'displayName': { 'type': 'string' },
          'roleIds': { 'type': 'array', 'items': { 'type': 'string' } },
          'revision': { 'type': 'integer', 'format': 'int64' },
        },
    },
  'CreateRoleRequest':
    {
      'type': 'object',
      'required': ['code', 'name', 'description', 'permissionIds'],
      'additionalProperties': false,
      'properties':
        {
          'code': { 'type': 'string' },
          'name': { 'type': 'string' },
          'description': { 'type': 'string', 'nullable': true },
          'permissionIds': { 'type': 'array', 'items': { 'type': 'string' } },
        },
    },
  'SaveRoleRequest':
    {
      'type': 'object',
      'required': ['id', 'name', 'description', 'permissionIds', 'revision'],
      'additionalProperties': false,
      'properties':
        {
          'id': { 'type': 'string' },
          'name': { 'type': 'string' },
          'description': { 'type': 'string', 'nullable': true },
          'permissionIds': { 'type': 'array', 'items': { 'type': 'string' } },
          'revision': { 'type': 'integer', 'format': 'int64' },
        },
    },
  'FeedbackAttachmentInitiateRequest':
    {
      'type': 'object',
      'required': ['fileName', 'contentType', 'size', 'sha256'],
      'additionalProperties': false,
      'properties':
        {
          'fileName': { 'type': 'string' },
          'contentType': { 'type': 'string' },
          'size': { 'type': 'integer', 'format': 'int64', 'minimum': 1 },
          'sha256': { 'type': 'string' },
        },
    },
  'FeedbackAttachmentRemoveRequest':
    {
      'type': 'object',
      'required': ['fileId'],
      'additionalProperties': false,
      'properties': { 'fileId': { 'type': 'string' } },
    },
  'FeedbackCreateRequest':
    {
      'type': 'object',
      'required':
        [
          'submissionKey',
          'category',
          'title',
          'content',
          'pagePath',
          'clientVersion',
          'relatedRequestId',
          'attachmentIds',
        ],
      'additionalProperties': false,
      'properties':
        {
          'submissionKey':
            {
              'type': 'string',
              'minLength': 16,
              'maxLength': 64,
              'pattern': '^[A-Za-z0-9_-]+$',
              'description': '客户端为一次反馈草稿生成并在重试时复用的幂等键。',
            },
          'category':
            { 'type': 'string', 'enum': ['BUG', 'SUGGESTION', 'OTHER'] },
          'title': { 'type': 'string' },
          'content': { 'type': 'string' },
          'pagePath': { 'type': 'string' },
          'clientVersion': { 'type': 'string' },
          'relatedRequestId': { 'type': 'string' },
          'attachmentIds': { 'type': 'array', 'items': { 'type': 'string' } },
        },
    },
  'FeedbackGetRequest':
    {
      'type': 'object',
      'required': ['feedbackId'],
      'additionalProperties': false,
      'properties': { 'feedbackId': { 'type': 'string' } },
    },
  'WorkbenchCategory': { 'type': 'string', 'enum': ['BOB', 'VOU'] },
  'WorkbenchPendingStage':
    { 'type': 'string', 'enum': ['CHECK', 'APPROVE', 'FINALIZE'] },
  'WorkbenchAction':
    {
      'type': 'string',
      'enum':
        ['view', 'edit', 'submit', 'approve', 'reject', 'check', 'finalize'],
    },
  'WorkbenchQueryRequest':
    {
      'type': 'object',
      'required': ['category', 'page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'category': { '$ref': '#/WorkbenchCategory' },
          'keyword': { 'type': 'string', 'maxLength': 128 },
          'entities':
            {
              'type': 'array',
              'maxItems': 100,
              'uniqueItems': true,
              'items':
                {
                  'type': 'string',
                  'pattern': '^[a-z][a-z0-9-]*$',
                  'maxLength': 64,
                },
            },
          'pendingStages':
            {
              'type': 'array',
              'maxItems': 3,
              'uniqueItems': true,
              'items': { '$ref': '#/WorkbenchPendingStage' },
            },
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 200 },
        },
    },
  'WorkbenchObjectItem':
    {
      'type': 'object',
      'required':
        [
          'category',
          'entity',
          'status',
          'pendingStage',
          'availableActions',
          'updatedAt',
          'objectId',
          'objectRevision',
          'versionId',
          'revision',
          'code',
          'name',
        ],
      'additionalProperties': false,
      'properties':
        {
          'category': { 'type': 'string', 'enum': ['BOB'] },
          'entity': { '$ref': '../schemas/bob.yaml#/BobEntity' },
          'status': { 'type': 'string', 'enum': ['DRAFT', 'PENDING'] },
          'pendingStage': { 'type': 'string', 'enum': ['CHECK', 'APPROVE'] },
          'availableActions':
            { 'type': 'array', 'items': { '$ref': '#/WorkbenchAction' } },
          'updatedAt': { 'type': 'string', 'format': 'date-time' },
          'objectId': { 'type': 'string' },
          'objectRevision': { 'type': 'integer', 'format': 'int64' },
          'versionId': { 'type': 'string' },
          'revision': { 'type': 'integer', 'format': 'int64' },
          'code': { 'type': 'string' },
          'name': { 'type': 'string' },
        },
    },
  'WorkbenchDocumentItem':
    {
      'type': 'object',
      'required':
        [
          'category',
          'entity',
          'status',
          'pendingStage',
          'availableActions',
          'updatedAt',
          'documentId',
          'revision',
          'documentNo',
          'businessDate',
          'partyName',
          'currency',
          'amount',
        ],
      'additionalProperties': false,
      'properties':
        {
          'category': { 'type': 'string', 'enum': ['VOU'] },
          'entity': { '$ref': '../schemas/vou.yaml#/VouEntity' },
          'status':
            { 'type': 'string', 'enum': ['DRAFT', 'CHECKED', 'APPROVED'] },
          'pendingStage': { '$ref': '#/WorkbenchPendingStage' },
          'availableActions':
            { 'type': 'array', 'items': { '$ref': '#/WorkbenchAction' } },
          'updatedAt': { 'type': 'string', 'format': 'date-time' },
          'documentId': { 'type': 'string' },
          'revision': { 'type': 'integer', 'format': 'int64' },
          'documentNo': { 'type': 'string' },
          'businessDate': { 'type': 'string', 'format': 'date' },
          'partyName': { 'type': 'string' },
          'currency': { 'type': 'string' },
          'amount': { 'type': 'string' },
        },
    },
  'WorkbenchPage':
    {
      'type': 'object',
      'required': ['items', 'total', 'page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'items':
            {
              'type': 'array',
              'items':
                {
                  'oneOf':
                    [
                      { '$ref': '#/WorkbenchObjectItem' },
                      { '$ref': '#/WorkbenchDocumentItem' },
                    ],
                },
            },
          'total': { 'type': 'integer', 'format': 'int64' },
          'page': { 'type': 'integer' },
          'pageSize': { 'type': 'integer' },
        },
    },
  'WorkbenchQueryResponse':
    {
      'type': 'object',
      'required': ['code', 'message', 'data', 'requestId'],
      'additionalProperties': false,
      'properties':
        {
          'code': { 'type': 'integer', 'format': 'int32' },
          'message': { 'type': 'string' },
          'data':
            {
              'type': 'object',
              'nullable': true,
              'allOf': [{ '$ref': '#/WorkbenchPage' }],
            },
          'requestId': { 'type': 'string' },
        },
    },
}
