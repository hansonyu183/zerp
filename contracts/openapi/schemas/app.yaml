{
  'SignInRequest':
    {
      'type': 'object',
      'required': ['username', 'password'],
      'additionalProperties': false,
      'properties':
        {
          'username': { 'type': 'string', 'minLength': 1, 'maxLength': 64 },
          'password': { 'type': 'string', 'minLength': 1, 'maxLength': 1024 },
        },
    },
  'ProfileRequest':
    {
      'type': 'object',
      'additionalProperties': false,
      'properties':
        {
          'displayName': { 'type': 'string', 'minLength': 1, 'maxLength': 128 },
          'avatarUrl':
            { 'type': 'string', 'nullable': true, 'maxLength': 2048 },
        },
    },
  'ChangePasswordRequest':
    {
      'type': 'object',
      'required': ['currentPassword', 'newPassword'],
      'additionalProperties': false,
      'properties':
        {
          'currentPassword': { 'type': 'string' },
          'newPassword': { 'type': 'string' },
        },
    },
  'CreateUserRequest':
    {
      'type': 'object',
      'required': ['username', 'displayName', 'password', 'roleIds'],
      'additionalProperties': false,
      'properties':
        {
          'username': { 'type': 'string' },
          'displayName': { 'type': 'string' },
          'password': { 'type': 'string' },
          'roleIds': { 'type': 'array', 'items': { 'type': 'string' } },
        },
    },
  'SaveUserRequest':
    {
      'type': 'object',
      'required': ['id', 'displayName', 'roleIds', 'revision'],
      'additionalProperties': false,
      'properties':
        {
          'id': { 'type': 'string' },
          'displayName': { 'type': 'string' },
          'roleIds': { 'type': 'array', 'items': { 'type': 'string' } },
          'revision': { 'type': 'integer', 'format': 'int64' },
        },
    },
  'CreateRoleRequest':
    {
      'type': 'object',
      'required': ['code', 'name', 'description', 'permissionIds'],
      'additionalProperties': false,
      'properties':
        {
          'code': { 'type': 'string' },
          'name': { 'type': 'string' },
          'description': { 'type': 'string', 'nullable': true },
          'permissionIds': { 'type': 'array', 'items': { 'type': 'string' } },
        },
    },
  'SaveRoleRequest':
    {
      'type': 'object',
      'required': ['id', 'name', 'description', 'permissionIds', 'revision'],
      'additionalProperties': false,
      'properties':
        {
          'id': { 'type': 'string' },
          'name': { 'type': 'string' },
          'description': { 'type': 'string', 'nullable': true },
          'permissionIds': { 'type': 'array', 'items': { 'type': 'string' } },
          'revision': { 'type': 'integer', 'format': 'int64' },
        },
    },
  'FeedbackAttachmentInitiateRequest':
    {
      'type': 'object',
      'required': ['fileName', 'contentType', 'size', 'sha256'],
      'additionalProperties': false,
      'properties':
        {
          'fileName': { 'type': 'string' },
          'contentType': { 'type': 'string' },
          'size': { 'type': 'integer', 'format': 'int64', 'minimum': 1 },
          'sha256': { 'type': 'string' },
        },
    },
  'FeedbackAttachmentRemoveRequest':
    {
      'type': 'object',
      'required': ['fileId'],
      'additionalProperties': false,
      'properties': { 'fileId': { 'type': 'string' } },
    },
  'FeedbackCreateRequest':
    {
      'type': 'object',
      'required':
        [
          'category',
          'title',
          'content',
          'pagePath',
          'clientVersion',
          'relatedRequestId',
          'attachmentIds',
        ],
      'additionalProperties': false,
      'properties':
        {
          'category':
            { 'type': 'string', 'enum': ['BUG', 'SUGGESTION', 'OTHER'] },
          'title': { 'type': 'string' },
          'content': { 'type': 'string' },
          'pagePath': { 'type': 'string' },
          'clientVersion': { 'type': 'string' },
          'relatedRequestId': { 'type': 'string' },
          'attachmentIds': { 'type': 'array', 'items': { 'type': 'string' } },
        },
    },
  'FeedbackGetRequest':
    {
      'type': 'object',
      'required': ['feedbackId'],
      'additionalProperties': false,
      'properties': { 'feedbackId': { 'type': 'string' } },
    },
}
