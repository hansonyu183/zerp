AuxEntity:
  type: string
  enum:
    - product-category
    - product-type
    - department
    - position
    - settlement-method
    - payment-method
    - dictionary-type
    - dictionary-item
    - measurement-unit
    - income-expense-type
    - asset-category

# Other AUX entities retain their existing entity-specific JSON object shapes.
# Settlement and payment methods below are closed and validated by the AUX
# service according to the path entity.
AuxData:
  type: object
  additionalProperties: true
  properties:
    behaviorProfile:
      $ref: '#/ProductBehaviorProfile'

ProductBehaviorProfile:
  type: string
  enum: [RAW_MATERIAL, STANDARD_FINISHED, CUSTOM_FINISHED, PACKAGING]

AuxProductTypeData:
  type: object
  additionalProperties: false
  required: [name, behaviorProfile, description]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    behaviorProfile:
      $ref: '#/ProductBehaviorProfile'
    description:
      type: string
      maxLength: 1000

AuxSettlementMethodData:
  type: object
  additionalProperties: false
  required:
    - name
    - termCode
    - ruleType
    - monthOffset
    - dayOfMonth
    - dayOffset
    - defaultSalesSurcharge
    - description
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
      description: 系统固定名称，不可修改。
    termCode:
      type: string
      enum:
        [
          PREPAID,
          CASH_ON_DELIVERY,
          ARRIVAL_3,
          ARRIVAL_5,
          ARRIVAL_7,
          ARRIVAL_15,
          ARRIVAL_30,
          MONTHLY_CURRENT,
          MONTHLY_30,
          MONTHLY_60,
          MONTHLY_90,
        ]
      description: 系统固定术语代码，不可修改。
    ruleType:
      type: string
      enum: [RELATIVE_DAYS, MONTH_END]
      description: 系统固定到期规则，不可修改。
    monthOffset:
      type: integer
      minimum: 0
      maximum: 3
      description: 系统固定月偏移；不适用时为 0。
    dayOfMonth:
      type: integer
      minimum: 0
      maximum: 31
      description: 系统固定月内日；不适用时为 0。
    dayOffset:
      type: integer
      minimum: 0
      maximum: 30
      description: 系统固定日偏移；不适用时为 0。
    defaultSalesSurcharge:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$'
      description: 非负、最多两位小数的元/kg默认销售加价。
    description:
      type: string
      maxLength: 1000

AuxPaymentMethodData:
  type: object
  additionalProperties: false
  required: [name, defaultSalesSurcharge, description]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    defaultSalesSurcharge:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$'
      default: '0.00'
      description: 非负、最多两位小数的元/kg默认销售加价。
    description:
      type: string
      maxLength: 1000

AuxCreateData:
  allOf:
    - $ref: '#/AuxData'
    - type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

AuxCreateRequest:
  type: object
  additionalProperties: false
  required: [data]
  properties:
    data:
      $ref: '#/AuxCreateData'

AuxSaveRequest:
  type: object
  additionalProperties: false
  required: [objectId, revision, data]
  properties:
    objectId:
      type: string
      minLength: 26
      maxLength: 26
    revision:
      type: integer
      format: int64
      minimum: 1
    data:
      $ref: '#/AuxData'

AuxRevisionRequest:
  type: object
  additionalProperties: false
  required: [objectId, revision]
  properties:
    objectId:
      type: string
      minLength: 26
      maxLength: 26
    revision:
      type: integer
      format: int64
      minimum: 1

AuxGetRequest:
  type: object
  additionalProperties: false
  required: [objectId]
  properties:
    objectId:
      type: string
      minLength: 26
      maxLength: 26
    versionId:
      type: string
      minLength: 26
      maxLength: 26

AuxQueryRequest:
  type: object
  additionalProperties: false
  required: [page, pageSize]
  properties:
    page:
      type: integer
      minimum: 1
    pageSize:
      type: integer
      minimum: 1
      maximum: 200
    filters:
      type: object
      additionalProperties: false
      properties:
        keyword: { type: string }
        enabled: { type: boolean }
        behaviorProfile:
          $ref: '#/ProductBehaviorProfile'
        parentId: { type: string }
        rootOnly: { type: boolean }
        dictionaryTypeCode: { type: string }
        direction:
          type: string
          enum: [INCOME, EXPENSE]
    sort:
      type: array
      maxItems: 1
      items:
        type: object
        additionalProperties: false
        required: [field, order]
        properties:
          field:
            type: string
            enum: [updatedAt, code, name, version]
          order:
            type: string
            enum: [asc, desc]

AuxHistoryRequest:
  type: object
  additionalProperties: false
  required: [objectId, page, pageSize]
  properties:
    objectId:
      type: string
      minLength: 26
      maxLength: 26
    page:
      type: integer
      minimum: 1
    pageSize:
      type: integer
      minimum: 1
      maximum: 200

AuxReferenceQueryRequest:
  type: object
  additionalProperties: false
  required: [entity]
  properties:
    entity:
      type: string
      enum: [settlement-method, payment-method, dictionary-item]
    keyword:
      type: string
      maxLength: 100
    dictionaryTypeCode:
      type: string
      maxLength: 32

AuxVersionView:
  type: object
  additionalProperties: false
  required: [versionId, version, data, createdAt, createdBy]
  properties:
    versionId: { type: string }
    version: { type: integer, format: int32 }
    data:
      $ref: '#/AuxData'
    createdAt: { type: string, format: date-time }
    createdBy: { type: string }

AuxObjectView:
  type: object
  additionalProperties: false
  required:
    [
      objectId,
      entity,
      code,
      enabled,
      objectRevision,
      currentVersion,
      updatedAt,
      updatedBy,
    ]
  properties:
    objectId: { type: string }
    entity:
      $ref: '#/AuxEntity'
    code: { type: string }
    enabled: { type: boolean }
    objectRevision: { type: integer, format: int64 }
    currentVersion:
      $ref: '#/AuxVersionView'
    updatedAt: { type: string, format: date-time }
    updatedBy: { type: string }

AuxObjectPage:
  type: object
  additionalProperties: false
  required: [items, total, page, pageSize]
  properties:
    items:
      type: array
      items:
        $ref: '#/AuxObjectView'
    total: { type: integer, format: int64 }
    page: { type: integer }
    pageSize: { type: integer }

AuxMutationResult:
  type: object
  additionalProperties: false
  required: [objectId, objectRevision, versionId, version, enabled]
  properties:
    objectId: { type: string }
    objectRevision: { type: integer, format: int64 }
    versionId: { type: string }
    version: { type: integer, format: int32 }
    enabled: { type: boolean }

AuxVersionPage:
  type: object
  additionalProperties: false
  required: [items, total, page, pageSize]
  properties:
    items:
      type: array
      items:
        $ref: '#/AuxVersionView'
    total: { type: integer, format: int64 }
    page: { type: integer }
    pageSize: { type: integer }

AuxAuditEventView:
  type: object
  additionalProperties: false
  required: [id, eventType, versionId, actorId, occurredAt, requestId, summary]
  properties:
    id: { type: string }
    eventType: { type: string }
    versionId: { type: string }
    actorId: { type: string }
    occurredAt: { type: string, format: date-time }
    requestId: { type: string }
    summary:
      type: object
      additionalProperties: true

AuxAuditEventPage:
  type: object
  additionalProperties: false
  required: [items, total, page, pageSize]
  properties:
    items:
      type: array
      items:
        $ref: '#/AuxAuditEventView'
    total: { type: integer, format: int64 }
    page: { type: integer }
    pageSize: { type: integer }

AuxQueryResponse:
  type: object
  additionalProperties: false
  required: [code, errorKey, message, data, requestId]
  properties:
    code: { type: integer, format: int32 }
    errorKey: { type: string }
    message: { type: string }
    data:
      type: object
      allOf:
        - $ref: '#/AuxObjectPage'
      nullable: true
    requestId: { type: string }

AuxObjectResponse:
  type: object
  additionalProperties: false
  required: [code, errorKey, message, data, requestId]
  properties:
    code: { type: integer, format: int32 }
    errorKey: { type: string }
    message: { type: string }
    data:
      type: object
      allOf:
        - $ref: '#/AuxObjectView'
      nullable: true
    requestId: { type: string }

AuxMutationResponse:
  type: object
  additionalProperties: false
  required: [code, errorKey, message, data, requestId]
  properties:
    code: { type: integer, format: int32 }
    errorKey: { type: string }
    message: { type: string }
    data:
      type: object
      allOf:
        - $ref: '#/AuxMutationResult'
      nullable: true
    requestId: { type: string }

AuxVersionPageResponse:
  type: object
  additionalProperties: false
  required: [code, errorKey, message, data, requestId]
  properties:
    code: { type: integer, format: int32 }
    errorKey: { type: string }
    message: { type: string }
    data:
      type: object
      allOf:
        - $ref: '#/AuxVersionPage'
      nullable: true
    requestId: { type: string }

AuxAuditEventPageResponse:
  type: object
  additionalProperties: false
  required: [code, errorKey, message, data, requestId]
  properties:
    code: { type: integer, format: int32 }
    errorKey: { type: string }
    message: { type: string }
    data:
      type: object
      allOf:
        - $ref: '#/AuxAuditEventPage'
      nullable: true
    requestId: { type: string }
