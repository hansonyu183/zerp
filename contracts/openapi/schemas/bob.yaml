          'objectRevision': { 'type': 'integer', 'format': 'int64' },
          'versionId': { 'type': 'string' },
          'revision': { 'type': 'integer', 'format': 'int64' },
        },
    },
  'BobVersionRevisionRequest':
    {
      'type': 'object',
      'required': ['objectId', 'versionId', 'revision'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'versionId': { 'type': 'string' },
          'revision': { 'type': 'integer', 'format': 'int64' },
        },
    },
  'BobReviewRequest':
    {
      'type': 'object',
      'required': ['objectId', 'versionId', 'revision', 'comment'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'versionId': { 'type': 'string' },
          'revision': { 'type': 'integer', 'format': 'int64' },
          'comment': { 'type': 'string', 'nullable': true },
        },
    },
  'BobHistoryRequest':
    {
      'type': 'object',
      'required': ['objectId', 'page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 200 },
        },
    },
}
