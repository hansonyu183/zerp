      'properties':
        {
          'objectId': { 'type': 'string' },
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 100 },
        },
    },
  'CustomerPricingCostItem':
    {
      'type': 'object',
      'required': ['name', 'basis'],
      'additionalProperties': false,
      'properties':
        {
          'name': { 'type': 'string', 'minLength': 1, 'maxLength': 100 },
          'basis': { 'type': 'string', 'enum': ['UNIT_PRICE', 'ORDER_AMOUNT'] },
          'unitPrice':
            {
              'type': 'string',
              'pattern': '^(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$',
            },
          'orderAmount':
            {
              'type': 'string',
              'pattern': '^(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$',
            },
        },
      'oneOf':
        [
          {
            'required': ['unitPrice'],
            'properties': { 'unitPrice': {}, 'orderAmount': {} },
            'not':
              {
                'required': ['orderAmount'],
                'properties': { 'orderAmount': {} },
              },
          },
          {
            'required': ['orderAmount'],
            'properties': { 'unitPrice': {}, 'orderAmount': {} },
            'not':
              { 'required': ['unitPrice'], 'properties': { 'unitPrice': {} } },
          },
        ],
    },
  'CustomerPricingPolicy':
    {
      'type': 'object',
      'required':
        [
          'defaultPremiumUnitPrice',
          'defaultDiscountUnitPrice',
