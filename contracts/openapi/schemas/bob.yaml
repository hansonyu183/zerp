{
  'BobEntity':
    {
      'type': 'string',
      'enum':
        [
          'customer',
          'customer-account',
          'supplier',
          'employee',
          'other-unit',
          'sales-partner',
          'product',
          'warehouse',
          'vehicle',
          'fund-account',
          'operating-entity',
        ],
    },
  'BobCrudEntity':
    {
      'type': 'string',
      'enum':
        [
          'employee',
          'product',
          'warehouse',
          'vehicle',
          'fund-account',
          'operating-entity',
        ],
      'description': '仍使用通用 CRUD 契约的 BOB 实体；客户和供应商使用各自的封闭契约。',
    },
  'BobQueryRequest':
    {
      'type': 'object',
      'required': ['page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 100 },
          'filters':
            {
              'type': 'object',
              'additionalProperties': true,
              'properties': {},
            },
          'sort':
            {
              'type': 'array',
              'items':
                {
                  'type': 'object',
                  'required': ['field', 'order'],
                  'additionalProperties': false,
                  'properties':
                    {
                      'field': { 'type': 'string' },
                      'order': { 'type': 'string', 'enum': ['asc', 'desc'] },
                    },
                },
            },
        },
    },
  'BobVersionSummary':
    {
      'type': 'object',
      'required': ['approval', 'summary'],
      'additionalProperties': false,
      'properties':
        {
          'approval': { '$ref': './common.yaml#/ApprovalVersionMeta' },
          'summary': { 'type': 'object', 'additionalProperties': true },
        },
    },
  'VehicleCarrierAffiliation':
    {
      'oneOf':
        [
          { '$ref': '#/VehicleInternalCarrierAffiliation' },
          { '$ref': '#/VehicleExternalCarrierAffiliation' },
        ],
      'discriminator':
        {
          'propertyName': 'type',
          'mapping':
            {
              'INTERNAL': '#/VehicleInternalCarrierAffiliation',
              'EXTERNAL': '#/VehicleExternalCarrierAffiliation',
            },
        },
    },
  'VehicleInternalCarrierAffiliation':
    {
      'type': 'object',
      'required': ['type', 'operatingEntityId'],
      'additionalProperties': false,
      'properties':
        {
          'type': { 'type': 'string', 'enum': ['INTERNAL'] },
          'operatingEntityId': { 'type': 'string' },
        },
    },
  'VehicleExternalCarrierAffiliation':
    {
      'type': 'object',
      'required': ['type', 'serviceRelationshipObjectId'],
      'additionalProperties': false,
      'properties':
        {
          'type': { 'type': 'string', 'enum': ['EXTERNAL'] },
          'serviceRelationshipObjectId': { 'type': 'string' },
        },
    },
  'BobListItem':
    {
      'type': 'object',
      'required':
        [
          'objectId',
          'entity',
          'code',
          'objectRevision',
          'enabled',
          'latestApproved',
          'openVersion',
          'updatedAt',
        ],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'entity': { '$ref': '#/BobEntity' },
          'code': { 'type': 'string' },
          'objectRevision': { 'type': 'integer', 'format': 'int64' },
          'enabled': { 'type': 'boolean' },
          'latestApproved':
            {
              'type': 'object',
              'allOf': [{ '$ref': '#/BobVersionSummary' }],
              'nullable': true,
            },
          'openVersion':
            {
              'type': 'object',
              'allOf': [{ '$ref': '#/BobVersionSummary' }],
              'nullable': true,
            },
          'updatedAt': { 'type': 'string', 'format': 'date-time' },
        },
    },
  'BobListPage':
    {
      'type': 'object',
      'required': ['items', 'total', 'page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'items': { 'type': 'array', 'items': { '$ref': '#/BobListItem' } },
          'total': { 'type': 'integer', 'format': 'int64' },
          'page': { 'type': 'integer' },
          'pageSize': { 'type': 'integer' },
        },
    },
  'BobQueryResponse':
    {
      'type': 'object',
      'required': ['code', 'errorKey', 'message', 'data', 'requestId'],
      'additionalProperties': false,
      'properties':
        {
          'code': { 'type': 'integer', 'format': 'int32' },
          'errorKey': { 'type': 'string' },
          'message': { 'type': 'string' },
          'data':
            {
              'type': 'object',
              'nullable': true,
              'allOf': [{ '$ref': '#/BobListPage' }],
            },
          'requestId': { 'type': 'string' },
        },
    },
  'BobGetRequest':
    {
      'type': 'object',
      'required': ['objectId'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'approvalEntryId': { 'type': 'string' },
        },
    },
  'EmploymentData':
    {
      'type': 'object',
      'required': ['operatingEntityId'],
      'additionalProperties': false,
      'properties':
        {
          'operatingEntityId': { 'type': 'string' },
          'departmentId': { 'type': 'string', 'nullable': true },
          'positionId': { 'type': 'string', 'nullable': true },
          'phone': { 'type': 'string', 'nullable': true },
          'email': { 'type': 'string', 'nullable': true },
          'hireDate': { 'type': 'string', 'nullable': true, 'format': 'date' },
          'remark': { 'type': 'string', 'nullable': true },
        },
    },
  'EmploymentCreateRequest':
    {
      'oneOf':
        [
          {
            'type': 'object',
            'required': ['partyId', 'data'],
            'additionalProperties': false,
            'properties':
              {
                'partyId': { 'type': 'string' },
                'data': { '$ref': '#/EmploymentData' },
              },
          },
          {
            'type': 'object',
            'required': ['newParty', 'data'],
            'additionalProperties': false,
            'properties':
              {
                'newParty': { '$ref': '#/PartyIdentityData' },
                'data': { '$ref': '#/EmploymentData' },
              },
          },
        ],
    },
  'BobCreateRequest':
    {
      'type': 'object',
      'required': ['data'],
      'additionalProperties': false,
      'properties':
        {
          'data':
            {
              'type': 'object',
              'required': ['name'],
              'additionalProperties': false,
              'properties':
                {
                  'name': { 'type': 'string', 'nullable': true },
                  'unit': { 'type': 'string', 'nullable': true },
                  'currency': { 'type': 'string', 'nullable': true },
                  'customerType': { 'type': 'string', 'nullable': true },
                  'plateNumber': { 'type': 'string', 'nullable': true },
                  'vehicleType': { 'type': 'string', 'nullable': true },
                  'carrierAffiliation':
                    { '$ref': '#/VehicleCarrierAffiliation', 'nullable': true },
                  'bulkLiquidCapable': { 'type': 'boolean', 'nullable': true },
                  'shortName': { 'type': 'string', 'nullable': true },
                  'categoryId': { 'type': 'string', 'nullable': true },
                  'taxNumber': { 'type': 'string', 'nullable': true },
                  'contactName': { 'type': 'string', 'nullable': true },
                  'contactPhone': { 'type': 'string', 'nullable': true },
                  'email': { 'type': 'string', 'nullable': true },
                  'address': { 'type': 'string', 'nullable': true },
                  'remark': { 'type': 'string', 'nullable': true },
                  'departmentId': { 'type': 'string', 'nullable': true },
                  'positionId': { 'type': 'string', 'nullable': true },
                  'phone': { 'type': 'string', 'nullable': true },
                  'hireDate': { 'type': 'string', 'nullable': true },
                  'specification': { 'type': 'string', 'nullable': true },
                  'model': { 'type': 'string', 'nullable': true },
                  'barcode': { 'type': 'string', 'nullable': true },
                  'description': { 'type': 'string', 'nullable': true },
                  'managerEmployeeId': { 'type': 'string', 'nullable': true },
                  'vin': { 'type': 'string', 'nullable': true },
                  'engineNumber': { 'type': 'string', 'nullable': true },
                  'loadCapacityKg': { 'type': 'string', 'nullable': true },
                  'accountName': { 'type': 'string', 'nullable': true },
                  'bankName': { 'type': 'string', 'nullable': true },
                  'bankBranch': { 'type': 'string', 'nullable': true },
                  'accountNumber': { 'type': 'string', 'nullable': true },
                  'operatingEntityId': { 'type': 'string' },
                  'settlementMethodId': { 'type': 'string', 'nullable': true },
                  'termCode': { 'type': 'string', 'nullable': true },
                  'defaultSalesSurcharge':
                    { 'type': 'string', 'nullable': true },
                  'salespersonEmployeeId':
                    { 'type': 'string', 'nullable': true },
                  'rebateUnitPrice':
                    {
                      'type': 'string',
                      'nullable': true,
                      'description': '仅客户适用；返点单价，单位为元/kg，省略按 0 处理',
                    },
                  'productTypeId': { 'type': 'string', 'nullable': true },
                  'defaultInputUnitId': { 'type': 'string', 'nullable': true },
                  'inventoryUnitId': { 'type': 'string', 'nullable': true },
                  'pricingUnitId': { 'type': 'string', 'nullable': true },
                  'unitConversions':
                    {
                      'type': 'array',
                      'nullable': true,
                      'items': { '$ref': '#/BobProductUnitConversionInput' },
                    },
                  'returnable': { 'type': 'boolean', 'nullable': true },
                  'defaultPackagingSpec':
                    {
                      'type': 'string',
                      'nullable': true,
                      'description': '仅非包装产品适用；一标准包装件对应的基准数量，必须大于零且最多六位小数',
                    },
                  'formula':
                    {
                      'type': 'object',
                      'allOf': [{ '$ref': '#/BobProductFormulaInput' }],
                      'nullable': true,
                    },
                },
            },
        },
    },
  'BobObjectRevisionRequest':
    {
      'type': 'object',
      'required': ['objectId', 'objectRevision'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'objectRevision': { 'type': 'integer', 'format': 'int64' },
        },
    },
  'BobSaveRequest':
    {
      'type': 'object',
      'required': ['objectId', 'approvalEntryId', 'approvalRevision', 'data'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'approvalEntryId': { 'type': 'string' },
          'approvalRevision': { 'type': 'integer', 'format': 'int64' },
          'data':
            {
              'type': 'object',
              'additionalProperties': false,
              'properties':
                {
                  'name': { 'type': 'string', 'nullable': true },
                  'unit': { 'type': 'string', 'nullable': true },
                  'currency': { 'type': 'string', 'nullable': true },
                  'customerType': { 'type': 'string', 'nullable': true },
                  'plateNumber': { 'type': 'string', 'nullable': true },
                  'vehicleType': { 'type': 'string', 'nullable': true },
                  'carrierAffiliation':
                    { '$ref': '#/VehicleCarrierAffiliation', 'nullable': true },
                  'bulkLiquidCapable': { 'type': 'boolean', 'nullable': true },
                  'shortName': { 'type': 'string', 'nullable': true },
                  'categoryId': { 'type': 'string', 'nullable': true },
                  'taxNumber': { 'type': 'string', 'nullable': true },
                  'contactName': { 'type': 'string', 'nullable': true },
                  'contactPhone': { 'type': 'string', 'nullable': true },
                  'email': { 'type': 'string', 'nullable': true },
                  'address': { 'type': 'string', 'nullable': true },
                  'remark': { 'type': 'string', 'nullable': true },
                  'departmentId': { 'type': 'string', 'nullable': true },
                  'positionId': { 'type': 'string', 'nullable': true },
                  'phone': { 'type': 'string', 'nullable': true },
                  'hireDate': { 'type': 'string', 'nullable': true },
                  'specification': { 'type': 'string', 'nullable': true },
                  'model': { 'type': 'string', 'nullable': true },
                  'barcode': { 'type': 'string', 'nullable': true },
                  'description': { 'type': 'string', 'nullable': true },
                  'managerEmployeeId': { 'type': 'string', 'nullable': true },
                  'vin': { 'type': 'string', 'nullable': true },
                  'engineNumber': { 'type': 'string', 'nullable': true },
                  'loadCapacityKg': { 'type': 'string', 'nullable': true },
                  'accountName': { 'type': 'string', 'nullable': true },
                  'bankName': { 'type': 'string', 'nullable': true },
                  'bankBranch': { 'type': 'string', 'nullable': true },
                  'accountNumber': { 'type': 'string', 'nullable': true },
                  'operatingEntityId': { 'type': 'string' },
                  'settlementMethodId': { 'type': 'string', 'nullable': true },
                  'termCode': { 'type': 'string', 'nullable': true },
                  'defaultSalesSurcharge':
                    { 'type': 'string', 'nullable': true },
                  'salespersonEmployeeId':
                    { 'type': 'string', 'nullable': true },
                  'rebateUnitPrice': { 'type': 'string', 'nullable': true },
                  'productTypeId': { 'type': 'string', 'nullable': true },
                  'defaultInputUnitId': { 'type': 'string', 'nullable': true },
                  'inventoryUnitId': { 'type': 'string', 'nullable': true },
                  'pricingUnitId': { 'type': 'string', 'nullable': true },
                  'unitConversions':
                    {
                      'type': 'array',
                      'nullable': true,
                      'items': { '$ref': '#/BobProductUnitConversionInput' },
                    },
                  'returnable': { 'type': 'boolean', 'nullable': true },
                  'defaultPackagingSpec':
                    {
                      'type': 'string',
                      'nullable': true,
                      'description': '仅非包装产品适用；一标准包装件对应的基准数量，必须大于零且最多六位小数',
                    },
                  'formula':
                    {
                      'type': 'object',
                      'allOf': [{ '$ref': '#/BobProductFormulaInput' }],
                      'nullable': true,
                    },
                },
            },
        },
    },
  'BobMeasurementUnitSnapshotInput':
    {
      'type': 'object',
      'required': ['objectId'],
      'additionalProperties': false,
      'properties': { 'objectId': { 'type': 'string' } },
    },
  'BobProductUnitConversionInput':
    {
      'type': 'object',
      'required': ['unit', 'factor'],
      'additionalProperties': false,
      'properties':
        {
          'unit': { '$ref': '#/BobMeasurementUnitSnapshotInput' },
          'factor':
            {
              'type': 'string',
              'pattern': '^(?:0*[1-9][0-9]*|0*\.[0-9]*[1-9][0-9]*)$',
            },
        },
    },
  'BobMeasurementUnitSnapshot':
    {
      'type': 'object',
      'required': ['objectId', 'approvalEntryId', 'code', 'name', 'symbol'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'approvalEntryId': { 'type': 'string' },
          'code': { 'type': 'string' },
          'name': { 'type': 'string' },
          'symbol': { 'type': 'string' },
        },
    },
  'BobProductUnitConversionSnapshot':
    {
      'type': 'object',
      'required': ['unit', 'factor'],
      'additionalProperties': false,
      'properties':
        {
          'unit': { '$ref': '#/BobMeasurementUnitSnapshot' },
          'factor':
            {
              'type': 'string',
              'pattern': '^(?:0*[1-9][0-9]*|0*\.[0-9]*[1-9][0-9]*)$',
            },
        },
    },
  'BobQuantitySnapshotInput':
    {
      'type': 'object',
      'required': ['enteredQuantity', 'enteredUnit', 'baseQuantity'],
      'additionalProperties': false,
      'properties':
        {
          'enteredQuantity': { 'type': 'string' },
          'enteredUnit': { '$ref': '#/BobMeasurementUnitSnapshotInput' },
          'baseQuantity': { 'type': 'string' },
        },
    },
  'BobProductFormulaInput':
    {
      'type': 'object',
      'required': ['output', 'components'],
      'additionalProperties': false,
      'properties':
        {
          'output': { '$ref': '#/BobQuantitySnapshotInput' },
          'components':
            {
              'type': 'array',
              'minItems': 1,
              'maxItems': 200,
              'items': { '$ref': '#/BobProductFormulaComponentInput' },
            },
        },
    },
  'BobProductFormulaComponentInput':
    {
      'type': 'object',
      'required': ['material', 'quantity'],
      'additionalProperties': false,
      'properties':
        {
          'material':
            {
              'type': 'object',
              'required': ['objectId', 'approvalEntryId'],
              'additionalProperties': false,
              'properties':
                {
                  'objectId': { 'type': 'string' },
                  'approvalEntryId': { 'type': 'string' },
                },
            },
          'quantity': { '$ref': '#/BobQuantitySnapshotInput' },
          'resolutionStatus':
            {
              'type': 'string',
              'enum': ['CURRENT', 'UNRESOLVED'],
              'nullable': true,
            },
          'requiresConfirmation': { 'type': 'boolean', 'nullable': true },
        },
    },
  'BobDeleteRequest':
    {
      'type': 'object',
      'required':
        ['objectId', 'objectRevision', 'approvalEntryId', 'approvalRevision'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'objectRevision': { 'type': 'integer', 'format': 'int64' },
          'approvalEntryId': { 'type': 'string' },
          'approvalRevision': { 'type': 'integer', 'format': 'int64' },
        },
    },
  'BobVersionRevisionRequest':
    {
      'type': 'object',
      'required': ['objectId', 'approvalEntryId', 'approvalRevision'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'approvalEntryId': { 'type': 'string' },
          'approvalRevision': { 'type': 'integer', 'format': 'int64' },
        },
    },
  'BobReviewRequest':
    {
      'type': 'object',
      'required': ['objectId', 'approvalEntryId', 'approvalRevision', 'reason'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'approvalEntryId': { 'type': 'string' },
          'approvalRevision': { 'type': 'integer', 'format': 'int64' },
          'reason': { 'type': 'string', 'nullable': true, 'maxLength': 1000 },
        },
    },
  'BobHistoryRequest':
    {
      'type': 'object',
      'required': ['objectId', 'page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 100 },
        },
    },
  'CustomerPricingCostItem':
    {
      'type': 'object',
      'required': ['name', 'basis'],
      'additionalProperties': false,
      'properties':
        {
          'name': { 'type': 'string', 'minLength': 1, 'maxLength': 100 },
          'basis': { 'type': 'string', 'enum': ['UNIT_PRICE', 'ORDER_AMOUNT'] },
          'unitPrice':
            {
              'type': 'string',
              'pattern': '^(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$',
            },
          'orderAmount':
            {
              'type': 'string',
              'pattern': '^(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$',
            },
        },
      'oneOf':
        [
          {
            'required': ['unitPrice'],
            'properties': { 'unitPrice': {}, 'orderAmount': {} },
            'not':
              {
                'required': ['orderAmount'],
                'properties': { 'orderAmount': {} },
              },
          },
          {
            'required': ['orderAmount'],
            'properties': { 'unitPrice': {}, 'orderAmount': {} },
            'not':
              { 'required': ['unitPrice'], 'properties': { 'unitPrice': {} } },
          },
        ],
    },
  'CustomerPricingPolicy':
    {
      'type': 'object',
      'required':
        [
          'defaultPremiumUnitPrice',
          'defaultDiscountUnitPrice',
          'costItems',
          'thirdPartyIntermediaryFixedUnitCost',
          'thirdPartyIntermediaryVariableUnitCost',
        ],
      'additionalProperties': false,
      'properties':
        {
          'defaultPremiumUnitPrice': { 'type': 'string' },
          'defaultDiscountUnitPrice': { 'type': 'string' },
          'costItems':
            {
              'type': 'array',
              'maxItems': 100,
              'items': { '$ref': '#/CustomerPricingCostItem' },
            },
          'thirdPartyIntermediaryFixedUnitCost': { 'type': 'string' },
          'thirdPartyIntermediaryVariableUnitCost': { 'type': 'string' },
        },
    },
  'CustomerSnapshot':
    {
      'type': 'object',
      'required': ['sourceObjectId', 'approvalEntryId', 'code', 'name'],
      'additionalProperties': false,
      'properties':
        {
          'sourceObjectId': { 'type': 'string' },
          'approvalEntryId': { 'type': 'string' },
          'code': { 'type': 'string' },
          'name': { 'type': 'string' },
          'termCode': { 'type': 'string' },
          'ruleType': { 'type': 'string' },
          'dueDays': { 'type': 'integer', 'format': 'int32' },
          'monthOffset': { 'type': 'integer', 'format': 'int32' },
          'cutoffDay': { 'type': 'integer', 'format': 'int32' },
          'defaultSalesSurcharge': { 'type': 'string' },
          'taxNumber': { 'type': 'string' },
          'address': { 'type': 'string' },
          'phone': { 'type': 'string' },
        },
    },
  'CustomerSalesAttributionInput':
    {
      'type': 'object',
      'required': ['type', 'subjectObjectId'],
      'additionalProperties': false,
      'properties':
        {
          'type':
            {
              'type': 'string',
              'enum':
                ['INTERNAL_EMPLOYEE', 'EXTERNAL_PART_TIME', 'CHANNEL_PARTNER'],
            },
          'subjectObjectId': { 'type': 'string' },
        },
    },
  'CustomerSalesAttributionView':
    {
      'type': 'object',
      'required':
        [
          'type',
          'subjectObjectId',
          'subjectApprovalEntryId',
          'subjectCode',
          'subjectName',
        ],
      'additionalProperties': false,
      'properties':
        {
          'type':
            {
              'type': 'string',
              'enum':
                ['INTERNAL_EMPLOYEE', 'EXTERNAL_PART_TIME', 'CHANNEL_PARTNER'],
            },
          'subjectObjectId': { 'type': 'string' },
          'subjectApprovalEntryId': { 'type': 'string' },
          'subjectCode': { 'type': 'string' },
          'subjectName': { 'type': 'string' },
        },
    },
  'CustomerCreditLimit':
    {
      'type': 'object',
      'required': ['currency', 'amount'],
      'additionalProperties': false,
      'properties':
        {
          'currency': { 'type': 'string', 'enum': ['CNY'] },
          'amount': { 'type': 'string' },
        },
    },
  'CustomerAccountInput':
    {
      'type': 'object',
      'required':
        [
          'name',
          'customerTypeCode',
          'operatingEntityId',
          'pricingPolicy',
          'creditLimits',
          'primarySalesAttribution',
        ],
      'additionalProperties': false,
      'properties':
        {
          'name': { 'type': 'string', 'minLength': 1, 'maxLength': 200 },
          'shortName': { 'type': 'string', 'nullable': true },
          'customerTypeCode': { 'type': 'string' },
          'contactName': { 'type': 'string', 'nullable': true },
          'contactPhone': { 'type': 'string', 'nullable': true },
          'email': { 'type': 'string', 'nullable': true },
          'address': { 'type': 'string', 'nullable': true },
          'operatingEntityId': { 'type': 'string' },
          'settlementMethodId': { 'type': 'string', 'nullable': true },
          'paymentMethodId': { 'type': 'string', 'nullable': true },
          'defaultTransportMethodCode':
            { 'type': 'string', 'nullable': true, 'maxLength': 32 },
          'defaultTransportMethodName':
            { 'type': 'string', 'nullable': true, 'maxLength': 100 },
          'transportSurcharge': { 'type': 'string', 'nullable': true },
          'pricingPolicy': { '$ref': '#/CustomerPricingPolicy' },
          'creditLimits':
            {
              'type': 'array',
