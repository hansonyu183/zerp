          'positionId': { 'type': 'string', 'nullable': true },
          'phone': { 'type': 'string', 'nullable': true },
          'hireDate': { 'type': 'string', 'nullable': true },
          'specification': { 'type': 'string', 'nullable': true },
          'model': { 'type': 'string', 'nullable': true },
          'barcode': { 'type': 'string', 'nullable': true },
          'description': { 'type': 'string', 'nullable': true },
          'managerEmployeeId': { 'type': 'string', 'nullable': true },
          'vin': { 'type': 'string', 'nullable': true },
          'engineNumber': { 'type': 'string', 'nullable': true },
          'loadCapacityKg': { 'type': 'string', 'nullable': true },
          'accountName': { 'type': 'string', 'nullable': true },
          'bankName': { 'type': 'string', 'nullable': true },
          'bankBranch': { 'type': 'string', 'nullable': true },
          'accountNumber': { 'type': 'string', 'nullable': true },
          'operatingEntityId': { 'type': 'string' },
          'settlementMethodId': { 'type': 'string', 'nullable': true },
          'termCode': { 'type': 'string', 'nullable': true },
          'defaultSalesSurcharge':
            { 'type': 'string', 'nullable': true },
          'salespersonEmployeeId':
            { 'type': 'string', 'nullable': true },
          'productTypeId': { 'type': 'string', 'nullable': true },
          'defaultInputUnitId': { 'type': 'string', 'nullable': true },
          'inventoryUnitId': { 'type': 'string', 'nullable': true },
          'pricingUnitId': { 'type': 'string', 'nullable': true },
          'unitConversions':
            {
              'type': 'array',
              'nullable': true,
              'items': { '$ref': '#/BobProductUnitConversionInput' },
            },
          'returnable': { 'type': 'boolean', 'nullable': true },
          'defaultPackagingSpec':
            {
              'type': 'string',
              'nullable': true,
              'description': '仅非包装产品适用；一标准包装件对应的基准数量，必须大于零且最多六位小数',
            },
          'formula':
            {
              'type': 'object',
              'allOf': [{ '$ref': '#/BobProductFormulaInput' }],
              'nullable': true,
            },
        },
    },
  'BobMeasurementUnitSnapshotInput':
    {
      'type': 'object',
      'required': ['objectId'],
      'additionalProperties': false,
      'properties': { 'objectId': { 'type': 'string' } },
    },
  'BobProductUnitConversionInput':
    {
      'type': 'object',
      'required': ['unit', 'factor'],
      'additionalProperties': false,
      'properties':
        {
          'unit': { '$ref': '#/BobMeasurementUnitSnapshotInput' },
          'factor':
            {
              'type': 'string',
              'pattern': '^(?:0*[1-9][0-9]*|0*\.[0-9]*[1-9][0-9]*)$',
            },
        },
    },
  'BobMeasurementUnitSnapshot':
    {
      'type': 'object',
      'required':
        ['objectId', 'approvalEntryId', 'code', 'name', 'symbol', 'quantityScale'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'approvalEntryId': { 'type': 'string' },
          'code': { 'type': 'string' },
          'name': { 'type': 'string' },
          'symbol': { 'type': 'string' },
          'quantityScale': { 'type': 'integer', 'minimum': 0, 'maximum': 6 },
        },
    },
  'BobProductUnitConversionSnapshot':
    {
      'type': 'object',
      'required': ['unit', 'factor'],
      'additionalProperties': false,
      'properties':
        {
          'unit': { '$ref': '#/BobMeasurementUnitSnapshot' },
          'factor':
            {
              'type': 'string',
              'pattern': '^(?:0*[1-9][0-9]*|0*\.[0-9]*[1-9][0-9]*)$',
            },
        },
    },
  'BobQuantitySnapshotInput':
