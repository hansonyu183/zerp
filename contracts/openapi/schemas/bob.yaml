{
  'BobEntity':
    {
      'type': 'string',
      'enum':
        [
          'customer',
          'customer-account',
          'supplier',
          'employee',
          'other-unit',
          'sales-partner',
          'product',
          'warehouse',
          'vehicle',
          'fund-account',
          'operating-entity',
        ],
    },
  'BobReadableEntity':
    {
      'type': 'string',
      'enum':
        [
          'employee',
          'other-unit',
          'sales-partner',
          'product',
          'warehouse',
          'vehicle',
          'fund-account',
          'operating-entity',
        ],
      'description': '仍可从 BOB current read model 查询或读取的实体；经营主体的候选与审批生命周期位于 DCL。',
    },
  'BobQueryRequest':
    {
      'type': 'object',
      'required': ['page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 100 },
          'filters':
            {
              'type': 'object',
              'additionalProperties': true,
              'properties': {},
            },
          'sort':
            {
              'type': 'array',
              'items':
                {
                  'type': 'object',
                  'required': ['field', 'order'],
                  'additionalProperties': false,
                  'properties':
                    {
                      'field': { 'type': 'string' },
                      'order': { 'type': 'string', 'enum': ['asc', 'desc'] },
                    },
                },
            },
        },
    },
  'VehicleCarrierAffiliation':
    {
      'oneOf':
        [
          { '$ref': '#/VehicleInternalCarrierAffiliation' },
          { '$ref': '#/VehicleExternalCarrierAffiliation' },
        ],
      'discriminator':
        {
          'propertyName': 'type',
          'mapping':
            {
              'INTERNAL': '#/VehicleInternalCarrierAffiliation',
              'EXTERNAL': '#/VehicleExternalCarrierAffiliation',
            },
        },
    },
  'VehicleInternalCarrierAffiliation':
    {
      'type': 'object',
      'required': ['type', 'operatingEntityId'],
      'additionalProperties': false,
      'properties':
        {
          'type': { 'type': 'string', 'enum': ['INTERNAL'] },
          'operatingEntityId': { 'type': 'string' },
        },
    },
  'VehicleExternalCarrierAffiliation':
    {
      'type': 'object',
      'required': ['type', 'serviceRelationshipObjectId'],
      'additionalProperties': false,
      'properties':
        {
          'type': { 'type': 'string', 'enum': ['EXTERNAL'] },
          'serviceRelationshipObjectId': { 'type': 'string' },
        },
    },
  'BobListItem':
    {
      'type': 'object',
      'required':
        [
          'objectId',
          'entity',
          'code',
          'objectRevision',
          'enabled',
          'sourceApprovalEntryId',
          'sourceVersionNo',
          'data',
          'updatedAt',
        ],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'entity': { '$ref': '#/BobEntity' },
          'code': { 'type': 'string' },
          'objectRevision': { 'type': 'integer', 'format': 'int64' },
          'enabled': { 'type': 'boolean' },
          'sourceApprovalEntryId': { 'type': 'string' },
          'sourceVersionNo': { 'type': 'integer', 'format': 'int32', 'minimum': 1 },
          'data': { '$ref': '#/BobDetailView' },
          'relationship': { '$ref': '#/BobRelationshipIdentityView' },
          'updatedAt': { 'type': 'string', 'format': 'date-time' },
        },
    },
  'BobListPage':
    {
      'type': 'object',
      'required': ['items', 'total', 'page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'items': { 'type': 'array', 'items': { '$ref': '#/BobListItem' } },
          'total': { 'type': 'integer', 'format': 'int64' },
          'page': { 'type': 'integer' },
          'pageSize': { 'type': 'integer' },
        },
    },
  'BobQueryResponse':
    {
      'type': 'object',
      'required': ['code', 'errorKey', 'message', 'data', 'requestId'],
      'additionalProperties': false,
      'properties':
        {
          'code': { 'type': 'integer', 'format': 'int32' },
          'errorKey': { 'type': 'string' },
