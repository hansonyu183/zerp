                  'accountName': { 'type': 'string', 'nullable': true },
                  'bankName': { 'type': 'string', 'nullable': true },
                  'bankBranch': { 'type': 'string', 'nullable': true },
                  'accountNumber': { 'type': 'string', 'nullable': true },
                  'operatingEntityId': { 'type': 'string' },
                  'settlementMethodId': { 'type': 'string', 'nullable': true },
                  'termCode': { 'type': 'string', 'nullable': true },
                  'defaultSalesSurcharge':
