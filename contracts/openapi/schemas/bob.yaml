  'BobPackagingSpecInput':
    {
      'type': 'object',
      'required':
        [
          'packagingProductObjectId',
          'packagingProductVersionId',
          'contentQuantity',
          'isDefault',
        ],
      'additionalProperties': false,
      'properties':
        {
          'packagingProductObjectId': { 'type': 'string' },
          'packagingProductVersionId': { 'type': 'string' },
          'contentQuantity': { 'type': 'string' },
          'isDefault': { 'type': 'boolean' },
        },
    },
  'BobProductFormulaInput':
    {
      'type': 'object',
      'required': ['baseOutputQuantity', 'components'],
      'additionalProperties': false,
      'properties':
        {
          'baseOutputQuantity': { 'type': 'string' },
          'components':
            {
              'type': 'array',
              'minItems': 1,
              'maxItems': 200,
              'items': { '$ref': '#/BobProductFormulaComponentInput' },
            },
        },
    },
  'BobProductFormulaComponentInput':
    {
      'type': 'object',
      'required': ['material', 'quantity'],
      'additionalProperties': false,
      'properties':
        {
          'material':
            {
              'type': 'object',
              'required': ['objectId', 'versionId'],
              'additionalProperties': false,
              'properties':
                {
                  'objectId': { 'type': 'string' },
                  'versionId': { 'type': 'string' },
                },
            },
          'quantity': { 'type': 'string' },
        },
    },
  'BobDeleteRequest':
    {
      'type': 'object',
      'required': ['objectId', 'objectRevision', 'versionId', 'revision'],
      'additionalProperties': false,
