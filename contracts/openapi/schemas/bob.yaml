{
  'BobEntity':
    {
      'type': 'string',
      'enum':
        [
          'customer',
          'customer-subunit',
          'supplier',
          'employee',
          'other-unit',
          'sales-partner',
          'product',
          'warehouse',
          'vehicle',
          'fund-account',
          'operating-entity',
        ],
    },
  'BobReadableEntity':
    {
      'type': 'string',
      'enum':
        ['product', 'warehouse', 'vehicle', 'fund-account', 'operating-entity'],
      'description': 'BOB 提供当前有效的只读业务资料；稳定 subject、强类型关系 identity、候选与审批生命周期均由 DCL 持有。',
    },
  'BobQueryRequest':
    {
      'type': 'object',
      'required': ['page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 100 },
          'filters':
            {
              'type': 'object',
              'additionalProperties': false,
              'properties':
                {
                  'keyword': { 'type': 'string' },
                  'enabled': { 'type': 'boolean' },
                  'categoryId': { 'type': 'string' },
                  'defaultPurchaserEmployeeId': { 'type': 'string' },
                  'operatingEntityId': { 'type': 'string' },
                  'productTypeId': { 'type': 'string' },
                },
            },
          'sort':
            {
              'type': 'array',
              'items':
                {
                  'type': 'object',
                  'required': ['field', 'order'],
                  'additionalProperties': false,
                  'properties':
                    {
                      'field': { 'type': 'string' },
                      'order': { 'type': 'string', 'enum': ['asc', 'desc'] },
                    },
                },
            },
        },
    },
  'VehicleCarrierAffiliation':
    {
      'oneOf':
        [
          { '$ref': '#/VehicleInternalCarrierAffiliation' },
          { '$ref': '#/VehicleExternalCarrierAffiliation' },
        ],
      'discriminator':
        {
          'propertyName': 'type',
          'mapping':
            {
              'INTERNAL': '#/VehicleInternalCarrierAffiliation',
              'EXTERNAL': '#/VehicleExternalCarrierAffiliation',
            },
        },
    },
  'VehicleInternalCarrierAffiliation':
    {
      'type': 'object',
      'required': ['type', 'operatingEntityId'],
      'additionalProperties': false,
      'properties':
        {
          'type': { 'type': 'string', 'enum': ['INTERNAL'] },
          'operatingEntityId': { 'type': 'string' },
        },
    },
  'VehicleExternalCarrierAffiliation':
    {
      'type': 'object',
      'required': ['type', 'otherUnitObjectId'],
      'additionalProperties': false,
      'properties':
        {
          'type': { 'type': 'string', 'enum': ['EXTERNAL'] },
          'otherUnitObjectId': { 'type': 'string' },
        },
    },
  'BobListItem':
    {
      'type': 'object',
      'required':
        [
          'objectId',
          'entity',
          'code',
          'enabled',
          'sourceApprovalEntryId',
          'sourceVersionNo',
          'data',
          'updatedAt',
        ],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'entity': { '$ref': '#/BobEntity' },
          'code': { 'type': 'string' },
          'enabled': { 'type': 'boolean' },
          'sourceApprovalEntryId': { 'type': 'string' },
          'sourceVersionNo':
            { 'type': 'integer', 'format': 'int32', 'minimum': 1 },
          'data': { '$ref': '#/BobDetailView' },
          'updatedAt': { 'type': 'string', 'format': 'date-time' },
        },
    },
  'BobListPage':
    {
      'type': 'object',
      'required': ['items', 'total', 'page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'items': { 'type': 'array', 'items': { '$ref': '#/BobListItem' } },
          'total': { 'type': 'integer', 'format': 'int64' },
          'page': { 'type': 'integer' },
          'pageSize': { 'type': 'integer' },
        },
    },
  'BobQueryResponse':
    {
      'type': 'object',
      'required': ['code', 'errorKey', 'message', 'data', 'requestId'],
      'additionalProperties': false,
      'properties':
        {
          'code': { 'type': 'integer', 'format': 'int32' },
          'errorKey': { 'type': 'string' },
          'message': { 'type': 'string' },
          'data':
            {
              'type': 'object',
              'nullable': true,
              'allOf': [{ '$ref': '#/BobListPage' }],
            },
          'requestId': { 'type': 'string' },
        },
    },
  'BobGetRequest':
    {
      'type': 'object',
      'required': ['objectId'],
      'additionalProperties': false,
      'properties': { 'objectId': { 'type': 'string' } },
    },
  'BobDetailData':
    {
      'type': 'object',
      'additionalProperties': false,
      'properties':
        {
          'name': { 'type': 'string', 'nullable': true },
          'unit': { 'type': 'string', 'nullable': true },
          'currency': { 'type': 'string', 'nullable': true },
          'customerType': { 'type': 'string', 'nullable': true },
          'plateNumber': { 'type': 'string', 'nullable': true },
          'vehicleType': { 'type': 'string', 'nullable': true },
          'carrierAffiliation':
            { '$ref': '#/VehicleCarrierAffiliation', 'nullable': true },
          'bulkLiquidCapable': { 'type': 'boolean', 'nullable': true },
          'shortName': { 'type': 'string', 'nullable': true },
          'categoryId': { 'type': 'string', 'nullable': true },
          'categoryCode': { 'type': 'string', 'nullable': true },
          'categoryName': { 'type': 'string', 'nullable': true },
          'legalIdentifier': { 'type': 'string', 'nullable': true },
          'taxNumber': { 'type': 'string', 'nullable': true },
          'contactName': { 'type': 'string', 'nullable': true },
          'contactPhone': { 'type': 'string', 'nullable': true },
          'email': { 'type': 'string', 'nullable': true },
          'address': { 'type': 'string', 'nullable': true },
          'remark': { 'type': 'string', 'nullable': true },
          'departmentId': { 'type': 'string', 'nullable': true },
          'departmentCode': { 'type': 'string', 'nullable': true },
          'departmentName': { 'type': 'string', 'nullable': true },
          'positionId': { 'type': 'string', 'nullable': true },
          'positionCode': { 'type': 'string', 'nullable': true },
          'positionName': { 'type': 'string', 'nullable': true },
          'phone': { 'type': 'string', 'nullable': true },
          'hireDate': { 'type': 'string', 'nullable': true },
          'specification': { 'type': 'string', 'nullable': true },
          'model': { 'type': 'string', 'nullable': true },
          'barcode': { 'type': 'string', 'nullable': true },
          'description': { 'type': 'string', 'nullable': true },
          'managerEmployeeId': { 'type': 'string', 'nullable': true },
          'vin': { 'type': 'string', 'nullable': true },
          'engineNumber': { 'type': 'string', 'nullable': true },
          'loadCapacityKg': { 'type': 'string', 'nullable': true },
          'accountName': { 'type': 'string', 'nullable': true },
          'bankName': { 'type': 'string', 'nullable': true },
          'bankBranch': { 'type': 'string', 'nullable': true },
          'accountNumber': { 'type': 'string', 'nullable': true },
          'operatingEntityId': { 'type': 'string' },
          'operatingEntityCode': { 'type': 'string', 'nullable': true },
          'operatingEntityName': { 'type': 'string', 'nullable': true },
          'settlementMethodId': { 'type': 'string', 'nullable': true },
          'settlementMethodCode': { 'type': 'string', 'nullable': true },
          'settlementMethodName': { 'type': 'string', 'nullable': true },
          'termCode': { 'type': 'string', 'nullable': true },
          'defaultSalesSurcharge': { 'type': 'string', 'nullable': true },
          'salespersonEmployeeId': { 'type': 'string', 'nullable': true },
          'defaultPurchaserEmployeeId': { 'type': 'string', 'nullable': true },
          'defaultPurchaserCode': { 'type': 'string', 'nullable': true },
          'defaultPurchaserName': { 'type': 'string', 'nullable': true },
          'productTypeId': { 'type': 'string', 'nullable': true },
          'defaultInputUnitId': { 'type': 'string', 'nullable': true },
          'defaultInputUnitCode': { 'type': 'string', 'nullable': true },
          'defaultInputUnitName': { 'type': 'string', 'nullable': true },
          'vehicleTypeName': { 'type': 'string', 'nullable': true },
          'inventoryUnitId': { 'type': 'string', 'nullable': true },
          'pricingUnitId': { 'type': 'string', 'nullable': true },
          'unitConversions':
            {
              'type': 'array',
              'nullable': true,
              'items': { '$ref': '#/BobProductUnitConversion' },
            },
          'returnable': { 'type': 'boolean', 'nullable': true },
          'defaultPackagingSpec':
            {
              'type': 'string',
              'nullable': true,
              'description': '仅非包装产品适用；一标准包装件对应的基准数量，必须大于零且最多六位小数',
            },
          'formula':
            {
              'type': 'object',
              'allOf': [{ '$ref': '#/BobProductFormula' }],
              'nullable': true,
            },
        },
    },
  'BobMeasurementUnitSnapshot':
    {
      'type': 'object',
      'required': ['objectId', 'code', 'name', 'symbol', 'quantityScale'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'code': { 'type': 'string' },
          'name': { 'type': 'string' },
          'symbol': { 'type': 'string' },
          'quantityScale': { 'type': 'integer', 'minimum': 0, 'maximum': 6 },
        },
    },
  'BobProductUnitConversion':
    {
      'type': 'object',
      'required': ['unit', 'factor'],
      'additionalProperties': false,
      'properties':
        {
          'unit': { '$ref': '#/BobMeasurementUnitSnapshot' },
          'factor':
            {
              'type': 'string',
              'pattern': '^(?:0*[1-9][0-9]*|0*\.[0-9]*[1-9][0-9]*)$',
            },
        },
    },
  'BobQuantitySnapshot':
    {
      'type': 'object',
      'required': ['enteredQuantity', 'enteredUnit', 'baseQuantity'],
      'additionalProperties': false,
      'properties':
        {
          'enteredQuantity': { 'type': 'string' },
          'enteredUnit': { '$ref': '#/BobMeasurementUnitSnapshot' },
          'baseQuantity': { 'type': 'string' },
        },
    },
  'BobProductFormula':
    {
      'type': 'object',
      'required': ['output', 'components'],
      'additionalProperties': false,
      'properties':
        {
          'output': { '$ref': '#/BobQuantitySnapshot' },
          'components':
            {
              'type': 'array',
              'minItems': 1,
              'maxItems': 200,
              'items': { '$ref': '#/BobProductFormulaComponent' },
            },
        },
    },
  'BobProductFormulaComponent':
    {
      'type': 'object',
      'required': ['material', 'quantity'],
      'additionalProperties': false,
      'properties':
        {
          'material':
            {
              'type': 'object',
              'required': ['objectId', 'approvalEntryId'],
              'additionalProperties': false,
              'properties':
                {
                  'objectId': { 'type': 'string' },
                  'approvalEntryId': { 'type': 'string' },
                },
            },
          'quantity': { '$ref': '#/BobQuantitySnapshot' },
          'resolutionStatus':
            {
              'type': 'string',
              'enum': ['CURRENT', 'UNRESOLVED'],
              'nullable': true,
            },
          'requiresConfirmation': { 'type': 'boolean', 'nullable': true },
        },
    },
  'BobCustomerQueryRequest':
    {
      'type': 'object',
      'required': ['page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'enum': [20] },
          'filters':
            {
              'type': 'object',
              'additionalProperties': false,
              'properties':
                {
                  'keyword': { 'type': 'string', 'maxLength': 200 },
                  'enabled': { 'type': 'boolean' },
                  'defaultOperatingEntityId': { 'type': 'string' },
                },
            },
          'sort':
            {
              'type': 'array',
              'maxItems': 1,
              'items':
                {
                  'type': 'object',
                  'required': ['field', 'order'],
                  'additionalProperties': false,
                  'properties':
                    {
                      'field': { 'type': 'string', 'enum': ['code'] },
                      'order': { 'type': 'string', 'enum': ['asc'] },
                    },
                },
            },
        },
    },
  'BobCustomerCurrentView':
    {
      'type': 'object',
      'required':
        [
          'objectId',
          'code',
          'sourceApprovalEntryId',
          'sourceVersionNo',
          'data',
          'attachments',
          'updatedAt',
        ],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'code': { 'type': 'string' },
          'sourceApprovalEntryId': { 'type': 'string' },
          'sourceVersionNo':
            { 'type': 'integer', 'format': 'int32', 'minimum': 1 },
          'data': { '$ref': './dcl.yaml#/DclCustomerData' },
          'attachments':
            {
              'type': 'array',
              'items': { '$ref': '#/BobCustomerAttachmentView' },
            },
          'updatedAt': { 'type': 'string', 'format': 'date-time' },
        },
    },
  'BobCustomerAttachmentView':
    {
      'type': 'object',
      'required':
        [
          'fileId',
          'fileName',
          'contentType',
          'size',
          'sha256',
          'status',
          'categoryObjectId',
          'categoryCode',
          'categoryName',
          'createdAt',
          'createdBy',
        ],
      'additionalProperties': false,
      'properties':
        {
          'fileId': { 'type': 'string' },
          'fileName': { 'type': 'string' },
          'contentType':
            {
              'type': 'string',
              'enum': ['application/pdf', 'image/jpeg', 'image/png'],
            },
          'size': { 'type': 'integer', 'format': 'int64' },
          'sha256': { 'type': 'string' },
          'status': { 'type': 'string', 'enum': ['READY'] },
          'categoryObjectId': { 'type': 'string' },
          'categoryCode': { 'type': 'string' },
          'categoryName': { 'type': 'string' },
          'storedAt': { 'type': 'string', 'format': 'date-time' },
          'createdAt': { 'type': 'string', 'format': 'date-time' },
          'createdBy': { 'type': 'string' },
        },
    },
  'BobCustomerListItem':
    {
      'type': 'object',
