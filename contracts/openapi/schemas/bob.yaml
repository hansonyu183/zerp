{
  'BobEntity':
    {
      'type': 'string',
      'enum':
        [
          'customer',
          'supplier',
          'other-party',
          'employee',
          'product',
          'service',
          'warehouse',
          'vehicle',
          'fund-account',
          'settlement-method',
        ],
    },
  'BobQueryRequest':
    {
      'type': 'object',
      'required': ['page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 100 },
          'filters':
            {
              'type': 'object',
              'additionalProperties': true,
              'properties': {},
            },
          'sort':
            {
              'type': 'array',
              'items':
                {
                  'type': 'object',
                  'required': ['field', 'order'],
                  'additionalProperties': false,
                  'properties':
                    {
                      'field': { 'type': 'string' },
                      'order': { 'type': 'string', 'enum': ['asc', 'desc'] },
                    },
                },
            },
        },
    },
  'BobVersionSummary':
    {
      'type': 'object',
      'required':
        [
          'versionId',
          'version',
          'status',
          'revision',
          'submittedBy',
          'summary',
        ],
      'additionalProperties': false,
      'properties':
        {
          'versionId': { 'type': 'string' },
          'version': { 'type': 'integer', 'format': 'int32' },
          'status':
            {
              'type': 'string',
              'enum': ['DRAFT', 'PENDING', 'REJECTED', 'EFFECTIVE', 'INVALID'],
            },
          'revision': { 'type': 'integer', 'format': 'int64' },
          'submittedBy': { 'type': 'string', 'nullable': true },
          'summary': { 'type': 'object', 'additionalProperties': true },
        },
    },
  'BobListItem':
    {
      'type': 'object',
      'required':
        [
          'objectId',
          'entity',
          'code',
          'objectRevision',
          'enabled',
          'currentVersion',
          'effectiveVersionId',
          'updatedAt',
        ],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'entity': { '$ref': '#/BobEntity' },
          'code': { 'type': 'string' },
          'objectRevision': { 'type': 'integer', 'format': 'int64' },
          'enabled': { 'type': 'boolean' },
          'currentVersion': { '$ref': '#/BobVersionSummary' },
          'effectiveVersionId': { 'type': 'string', 'nullable': true },
          'updatedAt': { 'type': 'string', 'format': 'date-time' },
        },
    },
  'BobListPage':
    {
      'type': 'object',
      'required': ['items', 'total', 'page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'items': { 'type': 'array', 'items': { '$ref': '#/BobListItem' } },
          'total': { 'type': 'integer', 'format': 'int64' },
          'page': { 'type': 'integer' },
          'pageSize': { 'type': 'integer' },
        },
    },
  'BobQueryResponse':
    {
      'type': 'object',
      'required': ['code', 'message', 'data', 'requestId'],
      'additionalProperties': false,
      'properties':
        {
          'code': { 'type': 'integer', 'format': 'int32' },
          'message': { 'type': 'string' },
          'data':
            {
              'type': 'object',
              'nullable': true,
              'allOf': [{ '$ref': '#/BobListPage' }],
            },
          'requestId': { 'type': 'string' },
        },
    },
  'BobGetRequest':
    {
      'type': 'object',
      'required': ['objectId'],
      'additionalProperties': false,
      'properties':
        { 'objectId': { 'type': 'string' }, 'versionId': { 'type': 'string' } },
    },
  'BobCreateRequest':
    {
      'type': 'object',
      'required': ['data'],
      'additionalProperties': false,
      'properties':
        {
          'data':
            {
              'type': 'object',
              'required': ['name'],
              'additionalProperties': false,
              'properties':
                {
                  'name': { 'type': 'string', 'nullable': true },
                  'unit': { 'type': 'string', 'nullable': true },
                  'currency': { 'type': 'string', 'nullable': true },
                  'supplierType': { 'type': 'string', 'nullable': true },
                  'customerType': { 'type': 'string', 'nullable': true },
                  'plateNumber': { 'type': 'string', 'nullable': true },
                  'vehicleType': { 'type': 'string', 'nullable': true },
                  'platformObjectId': { 'type': 'string', 'nullable': true },
                  'shortName': { 'type': 'string', 'nullable': true },
                  'categoryId': { 'type': 'string', 'nullable': true },
                  'taxNumber': { 'type': 'string', 'nullable': true },
                  'contactName': { 'type': 'string', 'nullable': true },
                  'contactPhone': { 'type': 'string', 'nullable': true },
                  'email': { 'type': 'string', 'nullable': true },
                  'address': { 'type': 'string', 'nullable': true },
                  'remark': { 'type': 'string', 'nullable': true },
                  'departmentId': { 'type': 'string', 'nullable': true },
                  'positionId': { 'type': 'string', 'nullable': true },
                  'phone': { 'type': 'string', 'nullable': true },
                  'hireDate': { 'type': 'string', 'nullable': true },
                  'specification': { 'type': 'string', 'nullable': true },
                  'model': { 'type': 'string', 'nullable': true },
                  'barcode': { 'type': 'string', 'nullable': true },
                  'description': { 'type': 'string', 'nullable': true },
                  'managerEmployeeId': { 'type': 'string', 'nullable': true },
                  'vin': { 'type': 'string', 'nullable': true },
                  'engineNumber': { 'type': 'string', 'nullable': true },
                  'loadCapacityKg': { 'type': 'string', 'nullable': true },
                  'accountName': { 'type': 'string', 'nullable': true },
                  'bankName': { 'type': 'string', 'nullable': true },
                  'bankBranch': { 'type': 'string', 'nullable': true },
                  'accountNumber': { 'type': 'string', 'nullable': true },
                  'settlementMethodId': { 'type': 'string', 'nullable': true },
                  'monthlyClosingDay':
                    {
                      'type': 'integer',
                      'minimum': 1,
                      'maximum': 31,
                      'description': '仅客户适用；创建客户时省略则按 31 处理',
                    },
                  'termCode': { 'type': 'string', 'nullable': true },
                  'defaultSalesSurcharge':
                    { 'type': 'string', 'nullable': true },
                  'salespersonEmployeeId':
                    { 'type': 'string', 'nullable': true },
                  'rebateUnitPrice':
                    {
                      'type': 'string',
                      'nullable': true,
                      'description': '仅客户适用；返点单价，单位为元/kg，省略按 0 处理',
                    },
                  'intermediaryOtherPartyId':
                    {
                      'type': 'string',
                      'nullable': true,
                      'description': '仅客户适用；引用其他往来单位中的居间商',
                    },
                  'productKind':
                    {
                      'type': 'string',
                      'enum':
                        [
                          'RAW_MATERIAL',
                          'STANDARD_FINISHED',
                          'CUSTOM_FINISHED',
                          'PACKAGING',
                        ],
                      'nullable': true,
                    },
                  'inventoryUnitId': { 'type': 'string', 'nullable': true },
                  'pricingUnitId': { 'type': 'string', 'nullable': true },
                  'pricingQuantityPerInventoryUnit':
                    { 'type': 'string', 'nullable': true },
                  'returnable': { 'type': 'boolean', 'nullable': true },
                  'packagingSpecs':
                    {
                      'type': 'array',
                      'nullable': true,
                      'items': { '$ref': '#/BobPackagingSpecInput' },
                    },
                  'formula':
                    {
                      'type': 'object',
                      'allOf': [{ '$ref': '#/BobProductFormulaInput' }],
                      'nullable': true,
                    },
                },
            },
        },
    },
  'BobObjectRevisionRequest':
    {
      'type': 'object',
      'required': ['objectId', 'objectRevision'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'objectRevision': { 'type': 'integer', 'format': 'int64' },
        },
    },
  'BobSaveRequest':
    {
      'type': 'object',
      'required': ['objectId', 'versionId', 'revision', 'data'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'versionId': { 'type': 'string' },
          'revision': { 'type': 'integer', 'format': 'int64' },
          'data':
            {
              'type': 'object',
              'additionalProperties': false,
              'properties':
                {
                  'name': { 'type': 'string', 'nullable': true },
                  'unit': { 'type': 'string', 'nullable': true },
                  'currency': { 'type': 'string', 'nullable': true },
                  'supplierType': { 'type': 'string', 'nullable': true },
                  'customerType': { 'type': 'string', 'nullable': true },
                  'plateNumber': { 'type': 'string', 'nullable': true },
                  'vehicleType': { 'type': 'string', 'nullable': true },
                  'platformObjectId': { 'type': 'string', 'nullable': true },
                  'shortName': { 'type': 'string', 'nullable': true },
                  'categoryId': { 'type': 'string', 'nullable': true },
                  'taxNumber': { 'type': 'string', 'nullable': true },
                  'contactName': { 'type': 'string', 'nullable': true },
                  'contactPhone': { 'type': 'string', 'nullable': true },
                  'email': { 'type': 'string', 'nullable': true },
                  'address': { 'type': 'string', 'nullable': true },
                  'remark': { 'type': 'string', 'nullable': true },
                  'departmentId': { 'type': 'string', 'nullable': true },
                  'positionId': { 'type': 'string', 'nullable': true },
                  'phone': { 'type': 'string', 'nullable': true },
                  'hireDate': { 'type': 'string', 'nullable': true },
                  'specification': { 'type': 'string', 'nullable': true },
                  'model': { 'type': 'string', 'nullable': true },
                  'barcode': { 'type': 'string', 'nullable': true },
                  'description': { 'type': 'string', 'nullable': true },
                  'managerEmployeeId': { 'type': 'string', 'nullable': true },
                  'vin': { 'type': 'string', 'nullable': true },
                  'engineNumber': { 'type': 'string', 'nullable': true },
                  'loadCapacityKg': { 'type': 'string', 'nullable': true },
                  'accountName': { 'type': 'string', 'nullable': true },
                  'bankName': { 'type': 'string', 'nullable': true },
                  'bankBranch': { 'type': 'string', 'nullable': true },
                  'accountNumber': { 'type': 'string', 'nullable': true },
                  'settlementMethodId': { 'type': 'string', 'nullable': true },
                  'monthlyClosingDay':
                    { 'type': 'integer', 'minimum': 1, 'maximum': 31 },
                  'termCode': { 'type': 'string', 'nullable': true },
                  'defaultSalesSurcharge':
                    { 'type': 'string', 'nullable': true },
                  'salespersonEmployeeId':
                    { 'type': 'string', 'nullable': true },
                  'rebateUnitPrice': { 'type': 'string', 'nullable': true },
                  'intermediaryOtherPartyId':
                    { 'type': 'string', 'nullable': true },
                  'productKind':
                    {
                      'type': 'string',
                      'enum':
                        [
                          'RAW_MATERIAL',
                          'STANDARD_FINISHED',
                          'CUSTOM_FINISHED',
                          'PACKAGING',
                        ],
                      'nullable': true,
                    },
                  'inventoryUnitId': { 'type': 'string', 'nullable': true },
                  'pricingUnitId': { 'type': 'string', 'nullable': true },
                  'pricingQuantityPerInventoryUnit':
                    { 'type': 'string', 'nullable': true },
                  'returnable': { 'type': 'boolean', 'nullable': true },
                  'packagingSpecs':
                    {
                      'type': 'array',
                      'nullable': true,
                      'items': { '$ref': '#/BobPackagingSpecInput' },
                    },
                  'formula':
                    {
                      'type': 'object',
                      'allOf': [{ '$ref': '#/BobProductFormulaInput' }],
                      'nullable': true,
                    },
                },
            },
        },
    },
  'BobPackagingSpecInput':
    {
      'type': 'object',
      'required':
        [
          'packagingProductObjectId',
          'packagingProductVersionId',
          'contentQuantity',
          'isDefault',
        ],
      'additionalProperties': false,
      'properties':
        {
          'packagingProductObjectId': { 'type': 'string' },
          'packagingProductVersionId': { 'type': 'string' },
          'contentQuantity': { 'type': 'string' },
          'isDefault': { 'type': 'boolean' },
        },
    },
  'BobProductFormulaInput':
    {
      'type': 'object',
      'required': ['baseOutputQuantity', 'components'],
      'additionalProperties': false,
      'properties':
        {
          'baseOutputQuantity': { 'type': 'string' },
          'components':
            {
              'type': 'array',
              'minItems': 1,
              'maxItems': 200,
              'items': { '$ref': '#/BobProductFormulaComponentInput' },
            },
        },
    },
  'BobProductFormulaComponentInput':
    {
      'type': 'object',
      'required': ['material', 'quantity'],
      'additionalProperties': false,
      'properties':
        {
          'material':
            {
              'type': 'object',
              'required': ['objectId', 'versionId'],
              'additionalProperties': false,
              'properties':
                {
                  'objectId': { 'type': 'string' },
                  'versionId': { 'type': 'string' },
                },
            },
          'quantity': { 'type': 'string' },
        },
    },
  'BobDeleteRequest':
    {
      'type': 'object',
      'required': ['objectId', 'objectRevision', 'versionId', 'revision'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'objectRevision': { 'type': 'integer', 'format': 'int64' },
          'versionId': { 'type': 'string' },
          'revision': { 'type': 'integer', 'format': 'int64' },
        },
    },
  'BobVersionRevisionRequest':
    {
      'type': 'object',
      'required': ['objectId', 'versionId', 'revision'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'versionId': { 'type': 'string' },
          'revision': { 'type': 'integer', 'format': 'int64' },
        },
    },
  'BobReverseRequest':
    {
      'type': 'object',
      'required':
        ['objectId', 'objectRevision', 'versionId', 'revision', 'reason'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'objectRevision': { 'type': 'integer', 'format': 'int64' },
          'versionId': { 'type': 'string' },
          'revision': { 'type': 'integer', 'format': 'int64' },
          'reason': { 'type': 'string', 'minLength': 1, 'maxLength': 1000 },
        },
    },
  'BobReviewRequest':
    {
      'type': 'object',
      'required': ['objectId', 'versionId', 'revision', 'comment'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'versionId': { 'type': 'string' },
          'revision': { 'type': 'integer', 'format': 'int64' },
          'comment': { 'type': 'string', 'nullable': true },
        },
    },
  'BobHistoryRequest':
    {
      'type': 'object',
      'required': ['objectId', 'page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 100 },
        },
    },
}
