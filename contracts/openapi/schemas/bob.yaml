                  'salespersonEmployeeId':
                    { 'type': 'string', 'nullable': true },
                  'productKind':
                    {
                      'type': 'string',
                      'enum':
                        [
                          'RAW_MATERIAL',
                          'STANDARD_FINISHED',
                          'CUSTOM_FINISHED',
                          'PACKAGING',
                        ],
                      'nullable': true,
                    },
                  'inventoryUnitId': { 'type': 'string', 'nullable': true },
                  'pricingUnitId': { 'type': 'string', 'nullable': true },
                  'pricingQuantityPerInventoryUnit':
                    { 'type': 'string', 'nullable': true },
                  'returnable': { 'type': 'boolean', 'nullable': true },
                  'packagingSpecs':
                    {
                      'type': 'array',
                      'nullable': true,
                      'items': { '$ref': '#/BobPackagingSpecInput' },
                    },
                  'formula':
                    {
                      'type': 'object',
                      'allOf': [{ '$ref': '#/BobProductFormulaInput' }],
                      'nullable': true,
                    },
                },
            },
        },
    },
  'BobEditRequest':
    {
      'type': 'object',
      'required': ['objectId', 'objectRevision'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'objectRevision': { 'type': 'integer', 'format': 'int64' },
        },
    },
  'BobSaveRequest':
    {
      'type': 'object',
      'required': ['objectId', 'versionId', 'revision', 'data'],
