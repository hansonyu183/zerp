{
  'BobEntity':
    {
      'type': 'string',
      'enum':
        [
          'customer',
          'supplier',
          'other-party',
          'employee',
          'product',
          'service',
          'warehouse',
          'vehicle',
          'fund-account',
          'operating-entity',
        ],
    },
  'BobQueryRequest':
    {
      'type': 'object',
      'required': ['page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 100 },
          'filters':
            {
              'type': 'object',
              'additionalProperties': true,
              'properties': {},
            },
          'sort':
            {
              'type': 'array',
              'items':
                {
                  'type': 'object',
                  'required': ['field', 'order'],
                  'additionalProperties': false,
                  'properties':
                    {
                      'field': { 'type': 'string' },
                      'order': { 'type': 'string', 'enum': ['asc', 'desc'] },
                    },
                },
            },
        },
    },
  'BobVersionSummary':
    {
      'type': 'object',
      'required':
        [
          'versionId',
          'version',
          'status',
          'revision',
          'submittedBy',
          'summary',
        ],
      'additionalProperties': false,
      'properties':
        {
          'versionId': { 'type': 'string' },
          'version': { 'type': 'integer', 'format': 'int32' },
          'status':
            {
              'type': 'string',
              'enum': ['DRAFT', 'PENDING', 'REJECTED', 'EFFECTIVE', 'INVALID'],
            },
          'revision': { 'type': 'integer', 'format': 'int64' },
          'submittedBy': { 'type': 'string', 'nullable': true },
          'summary': { 'type': 'object', 'additionalProperties': true },
        },
    },
  'BobListItem':
    {
      'type': 'object',
      'required':
        [
          'objectId',
          'entity',
          'code',
          'objectRevision',
          'enabled',
          'currentVersion',
          'effectiveVersionId',
          'updatedAt',
        ],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'entity': { '$ref': '#/BobEntity' },
          'code': { 'type': 'string' },
