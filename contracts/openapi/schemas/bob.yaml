            {
              'type': 'object',
              'nullable': true,
              'allOf': [{ '$ref': '#/BobListPage' }],
            },
          'requestId': { 'type': 'string' },
        },
    },
  'BobGetRequest':
    {
      'type': 'object',
      'required': ['objectId'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
        },
    },
