{
  'BobEntity':
    {
      'type': 'string',
      'enum':
        [
          'customer',
          'supplier',
          'employee',
          'product',
          'service',
          'warehouse',
          'vehicle',
          'fund-account',
        ],
    },
  'BobQueryRequest': { '$ref': '../schemas/common.yaml#/PageRequest' },
  'BobGetRequest':
    {
      'type': 'object',
      'required': ['objectId'],
      'additionalProperties': false,
      'properties':
        { 'objectId': { 'type': 'string' }, 'versionId': { 'type': 'string' } },
    },
  'BobCreateRequest':
    {
      'type': 'object',
      'required': ['data'],
      'additionalProperties': false,
      'properties':
        {
          'data':
            {
              'type': 'object',
              'required': ['name'],
              'additionalProperties': false,
              'properties':
