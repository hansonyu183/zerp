      'additionalProperties': false,
      'properties':
        {
          'operatingEntityId': { 'type': 'string' },
          'departmentId': { 'type': 'string', 'nullable': true },
          'positionId': { 'type': 'string', 'nullable': true },
          'phone': { 'type': 'string', 'nullable': true },
          'email': { 'type': 'string', 'nullable': true },
          'hireDate': { 'type': 'string', 'nullable': true, 'format': 'date' },
          'remark': { 'type': 'string', 'nullable': true },
        },
    },
  'EmploymentCreateRequest':
    {
      'oneOf':
        [
          {
            'type': 'object',
            'required': ['partyId', 'data'],
            'additionalProperties': false,
            'properties':
              {
                'partyId': { 'type': 'string' },
                'data': { '$ref': '#/EmploymentData' },
              },
          },
          {
            'type': 'object',
            'required': ['newParty', 'data'],
            'additionalProperties': false,
            'properties':
              {
                'newParty': { '$ref': '#/PartyIdentityData' },
                'data': { '$ref': '#/EmploymentData' },
