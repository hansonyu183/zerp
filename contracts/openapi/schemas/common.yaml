{
  'BusinessEnvelope':
    {
      'type': 'object',
      'required': ['code', 'errorKey', 'message', 'data', 'requestId'],
      'additionalProperties': false,
      'properties':
        {
          'code': { 'type': 'integer', 'format': 'int32' },
          'errorKey':
            {
              'type': 'string',
              'pattern': '^[a-z][a-z0-9_]*$|^$',
              'description': '稳定业务错误语义；成功时为空字符串。前端按此字段映射提示或选择业务分支。',
            },
          'message':
            {
              'type': 'string',
              'description': '用于诊断和未知 errorKey 的默认可读说明。前端不得比较、匹配或推断此字段；内部失败不得包含 SQL、调用栈、内部组件名或原始异常。',
            },
          'data':
            {
              'type': 'object',
              'nullable': true,
              'additionalProperties': true,
            },
          'requestId': { 'type': 'string' },
        },
    },
  'EmptyObject':
    { 'type': 'object', 'additionalProperties': false, 'properties': {} },
  'EmptyResponse':
    {
      'type': 'object',
      'required': ['code', 'errorKey', 'message', 'data', 'requestId'],
      'additionalProperties': false,
      'properties':
        {
          'code': { 'type': 'integer', 'format': 'int32' },
          'errorKey': { 'type': 'string' },
          'message': { 'type': 'string' },
          'data':
            {
              'type': 'object',
              'allOf': [{ '$ref': '#/EmptyObject' }],
              'nullable': true,
            },
          'requestId': { 'type': 'string' },
        },
    },
  'GenericObject':
    { 'type': 'object', 'additionalProperties': true, 'properties': {} },
  'IdRequest':
    {
      'type': 'object',
      'required': ['id'],
      'additionalProperties': false,
      'properties': { 'id': { 'type': 'string' } },
    },
  'RevisionRequest':
    {
      'type': 'object',
      'required': ['id', 'revision'],
      'additionalProperties': false,
      'properties':
        {
          'id': { 'type': 'string' },
          'revision': { 'type': 'integer', 'format': 'int64' },
        },
    },
  'ApprovalStatus':
    {
      'type': 'string',
      'enum': ['DRAFT', 'PENDING', 'APPROVED'],
      'description': 'Approval 唯一生命周期状态。',
    },
  'ApprovalLifecycleAction':
    {
      'type': 'string',
      'enum': ['submit', 'unsubmit', 'reject', 'approve', 'unapprove'],
      'description': 'Approval 唯一公开生命周期动作闭集。',
    },
  'ApprovalMeta':
    {
      'type': 'object',
      'required':
        [
          'status',
          'revision',
          'createdBy',
          'createdAt',
          'updatedBy',
          'updatedAt',
          'submittedBy',
          'submittedAt',
          'approvedBy',
          'approvedAt',
        ],
      'additionalProperties': false,
      'properties':
        {
          'status': { '$ref': '#/ApprovalStatus' },
          'revision': { 'type': 'integer', 'format': 'int64', 'minimum': 1 },
          'createdBy': { 'type': 'string' },
          'createdAt': { 'type': 'string', 'format': 'date-time' },
          'updatedBy': { 'type': 'string' },
          'updatedAt': { 'type': 'string', 'format': 'date-time' },
          'submittedBy': { 'type': 'string', 'nullable': true },
          'submittedAt':
            { 'type': 'string', 'format': 'date-time', 'nullable': true },
          'approvedBy': { 'type': 'string', 'nullable': true },
          'approvedAt':
            { 'type': 'string', 'format': 'date-time', 'nullable': true },
        },
    },
  'ApprovalVersionMeta':
    {
      'type': 'object',
      'required':
        [
          'approvalEntryId',
          'versionNo',
          'status',
          'revision',
          'createdBy',
          'createdAt',
          'updatedBy',
          'updatedAt',
          'submittedBy',
          'submittedAt',
          'approvedBy',
          'approvedAt',
        ],
      'additionalProperties': false,
      'properties':
        {
          'approvalEntryId':
            {
              'type': 'string',
              'description': '中央 Approval entry 的稳定身份。',
            },
          'versionNo':
            {
              'type': 'integer',
              'format': 'int32',
              'minimum': 1,
              'description': '同一 stable subject 内从 1 开始的版本号。',
            },
          'status': { '$ref': '#/ApprovalStatus' },
          'revision': { 'type': 'integer', 'format': 'int64', 'minimum': 1 },
          'createdBy': { 'type': 'string' },
          'createdAt': { 'type': 'string', 'format': 'date-time' },
          'updatedBy': { 'type': 'string' },
          'updatedAt': { 'type': 'string', 'format': 'date-time' },
          'submittedBy': { 'type': 'string', 'nullable': true },
          'submittedAt':
            { 'type': 'string', 'format': 'date-time', 'nullable': true },
          'approvedBy': { 'type': 'string', 'nullable': true },
          'approvedAt':
            { 'type': 'string', 'format': 'date-time', 'nullable': true },
        },
    },
  'ApprovalEventView':
    {
      'type': 'object',
      'required':
        [
          'id',
          'approvalEntryId',
          'action',
          'fromStatus',
          'toStatus',
          'fromRevision',
          'toRevision',
          'actorId',
          'reason',
          'requestId',
          'createdAt',
        ],
      'additionalProperties': false,
      'properties':
        {
          'id': { 'type': 'string' },
          'approvalEntryId': { 'type': 'string' },
          'action':
            {
              'type': 'string',
              'enum':
                [
                  'CREATED',
                  'SAVED',
                  'SUBMITTED',
                  'UNSUBMITTED',
                  'REJECTED',
                  'APPROVED',
                  'UNAPPROVED',
                  'DELETED',
                  'MERGED',
                ],
            },
          'fromStatus': { '$ref': '#/ApprovalStatus', 'nullable': true },
          'toStatus': { '$ref': '#/ApprovalStatus', 'nullable': true },
          'fromRevision':
            { 'type': 'integer', 'format': 'int64', 'nullable': true },
          'toRevision':
            { 'type': 'integer', 'format': 'int64', 'nullable': true },
          'actorId': { 'type': 'string' },
          'reason': { 'type': 'string', 'nullable': true },
          'requestId': { 'type': 'string' },
          'createdAt': { 'type': 'string', 'format': 'date-time' },
        },
    },
  'PageRequest':
    {
      'type': 'object',
      'required': ['page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 200 },
          'filters':
            {
              'type': 'object',
              'additionalProperties': true,
              'properties': {},
            },
          'sort':
            {
              'type': 'array',
              'items':
                {
                  'type': 'object',
                  'required': ['field', 'order'],
                  'additionalProperties': false,
                  'properties':
                    {
                      'field': { 'type': 'string' },
                      'order': { 'type': 'string', 'enum': ['asc', 'desc'] },
                    },
                },
            },
        },
    },
  'TechnicalError':
    {
      'type': 'object',
      'required': ['error', 'requestId'],
      'additionalProperties': false,
      'properties':
        { 'error': { 'type': 'string' }, 'requestId': { 'type': 'string' } },
    },
  'HealthResponse':
    {
      'type': 'object',
      'required': ['status'],
      'additionalProperties': false,
      'properties': { 'status': { 'type': 'string' } },
    },
}
