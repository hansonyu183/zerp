DclWflProcessDefinitionCreateRequest:
  type: object
  additionalProperties: false
  required: [script]
  properties:
    script: { type: string, minLength: 1 }

DclWflProcessDefinitionSaveRequest:
  type: object
  additionalProperties: false
  required: [code, approvalEntryId, approvalRevision, script]
  properties:
    code: { type: string, minLength: 3, maxLength: 64 }
    approvalEntryId: { type: string, minLength: 26, maxLength: 26 }
    approvalRevision: { type: integer, format: int64, minimum: 1 }
    script: { type: string, minLength: 1 }

DclWflProcessDefinitionVersionRequest:
  type: object
  additionalProperties: false
  required: [code, approvalEntryId, approvalRevision]
  properties:
    code: { type: string, minLength: 3, maxLength: 64 }
    approvalEntryId: { type: string, minLength: 26, maxLength: 26 }
    approvalRevision: { type: integer, format: int64, minimum: 1 }

DclWflProcessDefinitionReviewRequest:
  type: object
  additionalProperties: false
  required: [code, approvalEntryId, approvalRevision]
  properties:
    code: { type: string, minLength: 3, maxLength: 64 }
    approvalEntryId: { type: string, minLength: 26, maxLength: 26 }
    approvalRevision: { type: integer, format: int64, minimum: 1 }
    reason: { type: string, maxLength: 1000, nullable: true }

DclWflProcessDefinitionDeleteRequest:
  type: object
  additionalProperties: false
  required: [code, approvalEntryId, approvalRevision]
  properties:
    code: { type: string, minLength: 3, maxLength: 64 }
    approvalEntryId: { type: string, minLength: 26, maxLength: 26 }
    approvalRevision: { type: integer, format: int64, minimum: 1 }

DclWflProcessDefinitionGetRequest:
  type: object
  additionalProperties: false
  required: [code]
  properties:
    code: { type: string, minLength: 3, maxLength: 64 }
    approvalEntryId:
      type: string
      minLength: 26
      maxLength: 26
      description: Exact central Approval Version entry; omit to read the latest APPROVED or open candidate.

DclWflProcessDefinitionQueryRequest:
  type: object
  additionalProperties: false
  required: [page, pageSize]
  properties:
    page: { type: integer, minimum: 1 }
    pageSize: { type: integer, minimum: 1, maximum: 100 }
    filters:
      type: object
      additionalProperties: false
      properties:
        keyword: { type: string }
        status:
          type: array
          items: { $ref: './common.yaml#/ApprovalStatus' }
        includeDisabled: { type: boolean }
    sort:
      type: array
      items:
        type: object
        required: [field, order]
        additionalProperties: false
        properties:
          field: { type: string, enum: [code] }
          order: { type: string, enum: [asc] }

DclWflProcessDefinitionHistoryRequest:
  type: object
  additionalProperties: false
  required: [code, page, pageSize]
  properties:
    code: { type: string, minLength: 3, maxLength: 64 }
    page: { type: integer, minimum: 1 }
    pageSize: { type: integer, minimum: 1, maximum: 100 }

DclWflProcessDefinitionEnableRequest:
  type: object
  additionalProperties: false
  required: [code, approvalEntryId, approvalRevision]
  properties:
    code: { type: string, minLength: 3, maxLength: 64 }
    approvalEntryId: { type: string, minLength: 26, maxLength: 26 }
    approvalRevision: { type: integer, format: int64, minimum: 1 }

DclWflProcessDefinitionMutation:
  type: object
  additionalProperties: false
  required: [code, definitionId, enabled, approval]
  properties:
    code: { type: string }
    definitionId: { type: string }
    enabled: { type: boolean }
    approval: { $ref: './common.yaml#/ApprovalVersionMeta' }

DclWflProcessDefinitionView:
  type: object
  additionalProperties: false
  required:
    [
      code,
      definitionId,
      enabled,
      approval,
      availableApprovalActions,
      script,
      nodes,
      edges,
    ]
  properties:
    code: { type: string }
    definitionId: { type: string }
    enabled: { type: boolean }
    approval: { $ref: './common.yaml#/ApprovalVersionMeta' }
    availableApprovalActions:
      type: array
      items: { $ref: './common.yaml#/ApprovalLifecycleAction' }
    script: { type: string }
    diagnostic: { $ref: './wfl.yaml#/WflDefinitionDiagnostic' }
    nodes:
      type: array
      items: { $ref: './wfl.yaml#/WflDefinitionNode' }
    edges:
      type: array
      items: { $ref: './wfl.yaml#/WflDefinitionEdge' }

DclWflProcessDefinitionVersionView:
  type: object
  additionalProperties: false
  required: [script, approval, nodes, edges]
  properties:
    script: { type: string }
    diagnostic: { $ref: './wfl.yaml#/WflDefinitionDiagnostic' }
    approval: { $ref: './common.yaml#/ApprovalVersionMeta' }
    nodes:
      type: array
      items: { $ref: './wfl.yaml#/WflDefinitionNode' }
    edges:
      type: array
      items: { $ref: './wfl.yaml#/WflDefinitionEdge' }

DclWflProcessDefinitionVersionSummary:
  type: object
  additionalProperties: false
  required: [approval]
  properties:
    approval: { $ref: './common.yaml#/ApprovalVersionMeta' }

DclWflProcessDefinitionListItem:
  type: object
  additionalProperties: false
  required:
    [
      code,
      definitionId,
      enabled,
      availableApprovalActions,
      latestApproved,
      openVersion,
    ]
  properties:
    code: { type: string }
    definitionId: { type: string }
    enabled: { type: boolean }
    availableApprovalActions:
      type: array
      items: { $ref: './common.yaml#/ApprovalLifecycleAction' }
    latestApproved:
      type: object
      allOf: [{ $ref: '#/DclWflProcessDefinitionVersionSummary' }]
      nullable: true
    openVersion:
      type: object
      allOf: [{ $ref: '#/DclWflProcessDefinitionVersionSummary' }]
      nullable: true

DclWflProcessDefinitionMutationResponse:
  type: object
  additionalProperties: false
  required: [code, errorKey, message, data, requestId]
  properties:
    code: { type: integer, format: int32 }
    errorKey: { type: string }
    message: { type: string }
    data: { $ref: '#/DclWflProcessDefinitionMutation', nullable: true }
    requestId: { type: string }

DclWflProcessDefinitionViewResponse:
  type: object
  additionalProperties: false
  required: [code, errorKey, message, data, requestId]
  properties:
    code: { type: integer, format: int32 }
    errorKey: { type: string }
    message: { type: string }
    data: { $ref: '#/DclWflProcessDefinitionView', nullable: true }
    requestId: { type: string }

DclWflProcessDefinitionQueryPageData:
  type: object
  additionalProperties: false
  required: [items, total, page, pageSize]
  properties:
    items:
      type: array
      items: { $ref: '#/DclWflProcessDefinitionListItem' }
    total: { type: integer, format: int64 }
    page: { type: integer }
    pageSize: { type: integer }

DclWflProcessDefinitionQueryResponse:
  type: object
  additionalProperties: false
  required: [code, errorKey, message, data, requestId]
  properties:
    code: { type: integer, format: int32 }
    errorKey: { type: string }
    message: { type: string }
    data: { $ref: '#/DclWflProcessDefinitionQueryPageData', nullable: true }
    requestId: { type: string }

DclWflProcessDefinitionVersionPageData:
  type: object
  additionalProperties: false
  required: [items, total, page, pageSize]
  properties:
    items:
      type: array
      items: { $ref: '#/DclWflProcessDefinitionVersionView' }
    total: { type: integer, format: int64 }
    page: { type: integer }
    pageSize: { type: integer }

DclWflProcessDefinitionVersionPageResponse:
  type: object
  additionalProperties: false
  required: [code, errorKey, message, data, requestId]
  properties:
    code: { type: integer, format: int32 }
    errorKey: { type: string }
    message: { type: string }
    data: { $ref: '#/DclWflProcessDefinitionVersionPageData', nullable: true }
    requestId: { type: string }

DclWflProcessDefinitionAuditHistoryResponse:
  $ref: './dcl.yaml#/DclWarehouseAuditHistoryResponse'
