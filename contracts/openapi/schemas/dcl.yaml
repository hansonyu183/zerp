{
  'DclOperatingEntityData':
    {
      'type': 'object',
      'required': ['name'],
      'additionalProperties': false,
      'properties':
        {
          'name': { 'type': 'string', 'minLength': 1 },
          'shortName': { 'type': 'string' },
          'taxNumber': { 'type': 'string' },
          'address': { 'type': 'string' },
          'phone': { 'type': 'string' },
          'remark': { 'type': 'string' },
        },
    },
  'DclOperatingEntityCreateRequest':
    {
      'type': 'object',
      'required': ['data'],
      'additionalProperties': false,
      'properties': { 'data': { '$ref': '#/DclOperatingEntityData' } },
    },
  'DclOperatingEntitySaveRequest':
    {
      'type': 'object',
      'required':
        ['objectId', 'approvalEntryId', 'approvalRevision', 'enabled', 'data'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'approvalEntryId': { 'type': 'string' },
          'approvalRevision':
            { 'type': 'integer', 'format': 'int64', 'minimum': 1 },
          'enabled': { 'type': 'boolean' },
          'data': { '$ref': '#/DclOperatingEntityData' },
        },
    },
  'DclOperatingEntityVersionRequest':
    {
      'type': 'object',
      'required': ['objectId', 'approvalEntryId', 'approvalRevision'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'approvalEntryId': { 'type': 'string' },
          'approvalRevision':
            { 'type': 'integer', 'format': 'int64', 'minimum': 1 },
        },
    },
  'DclOperatingEntityReviewRequest':
    {
      'type': 'object',
      'required': ['objectId', 'approvalEntryId', 'approvalRevision', 'reason'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'approvalEntryId': { 'type': 'string' },
          'approvalRevision':
            { 'type': 'integer', 'format': 'int64', 'minimum': 1 },
          'reason': { 'type': 'string', 'nullable': true, 'maxLength': 1000 },
        },
    },
  'DclOperatingEntityGetRequest':
    {
      'type': 'object',
      'required': ['objectId'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'approvalEntryId': { 'type': 'string' },
        },
    },
  'DclOperatingEntityQueryRequest':
    {
      'type': 'object',
      'required': ['page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 100 },
          'filters':
            {
              'type': 'object',
              'additionalProperties': false,
              'properties':
                {
                  'keyword': { 'type': 'string' },
                  'status':
                    {
                      'type': 'array',
                      'items': { '$ref': './common.yaml#/ApprovalStatus' },
                    },
                  'enabled': { 'type': 'boolean' },
                },
            },
          'sort':
            {
              'type': 'array',
              'items':
                {
                  'type': 'object',
                  'required': ['field', 'order'],
                  'additionalProperties': false,
                  'properties':
                    {
                      'field': { 'type': 'string' },
                      'order': { 'type': 'string', 'enum': ['asc', 'desc'] },
                    },
                },
            },
        },
    },
  'DclOperatingEntityHistoryRequest':
    {
      'type': 'object',
      'required': ['objectId', 'page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 100 },
        },
    },
  'DclOperatingEntityMutation':
    {
      'type': 'object',
      'required': ['objectId', 'objectRevision', 'enabled', 'approval'],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'objectRevision': { 'type': 'integer', 'format': 'int64' },
          'enabled': { 'type': 'boolean' },
          'approval': { '$ref': './common.yaml#/ApprovalVersionMeta' },
        },
    },
  'DclOperatingEntityView':
    {
      'type': 'object',
      'required':
        [
          'objectId',
          'entity',
          'code',
          'objectRevision',
          'enabled',
          'approval',
          'data',
          'updatedAt',
        ],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'entity': { 'type': 'string', 'enum': ['operating-entity'] },
          'code': { 'type': 'string' },
          'objectRevision': { 'type': 'integer', 'format': 'int64' },
          'enabled': { 'type': 'boolean' },
          'approval': { '$ref': './common.yaml#/ApprovalVersionMeta' },
          'data': { '$ref': '#/DclOperatingEntityData' },
          'updatedAt': { 'type': 'string', 'format': 'date-time' },
        },
    },
  'DclOperatingEntityVersionView':
    {
      'type': 'object',
      'required': ['approval', 'data', 'enabled'],
      'additionalProperties': false,
      'properties':
        {
          'approval': { '$ref': './common.yaml#/ApprovalVersionMeta' },
          'data': { '$ref': '#/DclOperatingEntityData' },
          'enabled': { 'type': 'boolean' },
        },
    },
  'DclOperatingEntityListItem':
    {
      'type': 'object',
      'required':
        [
          'objectId',
          'entity',
          'code',
          'objectRevision',
          'enabled',
          'latestApproved',
          'openVersion',
          'updatedAt',
        ],
      'additionalProperties': false,
      'properties':
        {
          'objectId': { 'type': 'string' },
          'entity': { 'type': 'string', 'enum': ['operating-entity'] },
          'code': { 'type': 'string' },
          'objectRevision': { 'type': 'integer', 'format': 'int64' },
          'enabled': { 'type': 'boolean' },
          'latestApproved':
            {
              'type': 'object',
              'allOf': [{ '$ref': '#/DclOperatingEntityVersionView' }],
              'nullable': true,
            },
          'openVersion':
            {
              'type': 'object',
              'allOf': [{ '$ref': '#/DclOperatingEntityVersionView' }],
              'nullable': true,
            },
          'updatedAt': { 'type': 'string', 'format': 'date-time' },
        },
    },
  'DclOperatingEntityQueryPage':
    {
      'type': 'object',
      'required': ['items', 'total', 'page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'items':
            {
              'type': 'array',
              'items': { '$ref': '#/DclOperatingEntityListItem' },
            },
          'total': { 'type': 'integer', 'format': 'int64' },
          'page': { 'type': 'integer' },
          'pageSize': { 'type': 'integer' },
        },
    },
  'DclOperatingEntityVersionPage':
    {
      'type': 'object',
      'required': ['items', 'total', 'page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'items':
            {
              'type': 'array',
              'items': { '$ref': '#/DclOperatingEntityVersionView' },
            },
          'total': { 'type': 'integer', 'format': 'int64' },
          'page': { 'type': 'integer' },
          'pageSize': { 'type': 'integer' },
        },
    },
  'DclOperatingEntityAuditEventPage':
    {
      'type': 'object',
      'required': ['items', 'total', 'page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'items':
            {
              'type': 'array',
              'items': { '$ref': './common.yaml#/ApprovalEventView' },
            },
          'total': { 'type': 'integer', 'format': 'int64' },
          'page': { 'type': 'integer' },
          'pageSize': { 'type': 'integer' },
        },
    },
  'DclOperatingEntityMutationResponse':
    {
      'type': 'object',
      'required': ['code', 'errorKey', 'message', 'data', 'requestId'],
      'additionalProperties': false,
      'properties':
        {
          'code': { 'type': 'integer', 'format': 'int32' },
          'errorKey': { 'type': 'string' },
          'message': { 'type': 'string' },
          'data':
            {
              'type': 'object',
              'allOf': [{ '$ref': '#/DclOperatingEntityMutation' }],
              'nullable': true,
            },
          'requestId': { 'type': 'string' },
        },
    },
  'DclOperatingEntityViewResponse':
    {
      'type': 'object',
      'required': ['code', 'errorKey', 'message', 'data', 'requestId'],
      'additionalProperties': false,
      'properties':
        {
          'code': { 'type': 'integer', 'format': 'int32' },
          'errorKey': { 'type': 'string' },
          'message': { 'type': 'string' },
          'data':
            {
              'type': 'object',
              'allOf': [{ '$ref': '#/DclOperatingEntityView' }],
              'nullable': true,
            },
          'requestId': { 'type': 'string' },
        },
    },
  'DclOperatingEntityQueryResponse':
    {
      'type': 'object',
      'required': ['code', 'errorKey', 'message', 'data', 'requestId'],
      'additionalProperties': false,
      'properties':
        {
          'code': { 'type': 'integer', 'format': 'int32' },
          'errorKey': { 'type': 'string' },
          'message': { 'type': 'string' },
          'data':
            {
              'type': 'object',
              'allOf': [{ '$ref': '#/DclOperatingEntityQueryPage' }],
              'nullable': true,
            },
          'requestId': { 'type': 'string' },
        },
    },
  'DclOperatingEntityVersionPageResponse':
    {
      'type': 'object',
      'required': ['code', 'errorKey', 'message', 'data', 'requestId'],
      'additionalProperties': false,
      'properties':
        {
          'code': { 'type': 'integer', 'format': 'int32' },
          'errorKey': { 'type': 'string' },
          'message': { 'type': 'string' },
          'data':
            {
              'type': 'object',
              'allOf': [{ '$ref': '#/DclOperatingEntityVersionPage' }],
              'nullable': true,
            },
          'requestId': { 'type': 'string' },
        },
    },
  'DclOperatingEntityAuditHistoryResponse':
    {
      'type': 'object',
      'required': ['code', 'errorKey', 'message', 'data', 'requestId'],
      'additionalProperties': false,
      'properties':
        {
          'code': { 'type': 'integer', 'format': 'int32' },
          'errorKey': { 'type': 'string' },
          'message': { 'type': 'string' },
          'data':
            {
              'type': 'object',
              'allOf': [{ '$ref': '#/DclOperatingEntityAuditEventPage' }],
              'nullable': true,
            },
          'requestId': { 'type': 'string' },
        },
    },
}
