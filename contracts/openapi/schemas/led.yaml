{
  'LedClosingRequest':
    {
      'type': 'object',
      'required': ['revision', 'closingDate'],
      'additionalProperties': false,
      'properties':
        {
          'revision': { 'type': 'integer', 'format': 'int64' },
          'closingDate': { 'type': 'string', 'format': 'date' },
        },
    },
  'LedUncloseRequest':
    {
      'type': 'object',
      'required': ['revision', 'reason'],
      'additionalProperties': false,
      'properties':
        {
          'revision': { 'type': 'integer', 'format': 'int64' },
          'reason': { 'type': 'string' },
        },
    },
  'LedHistoryRequest':
    {
      'type': 'object',
      'required': ['page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 200 },
        },
    },
  'LedQueryRequest':
    {
      'type': 'object',
      'required': ['page', 'pageSize', 'filters', 'sort'],
      'additionalProperties': false,
      'properties':
        {
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 200 },
          'filters':
            {
              'type': 'object',
              'required': ['dateFrom', 'dateTo'],
              'additionalProperties': false,
              'properties':
                {
                  'dateFrom': { 'type': 'string', 'format': 'date' },
                  'dateTo': { 'type': 'string', 'format': 'date' },
                  'objectId': { 'type': 'string' },
                  'sourceEntity': { 'type': 'string' },
                  'documentNo': { 'type': 'string' },
                  'direction':
                    { 'type': 'array', 'items': { 'type': 'string' } },
                },
            },
          'sort':
            {
              'type': 'array',
              'items':
                {
                  'type': 'object',
                  'required': ['field', 'order'],
                  'additionalProperties': false,
                  'properties':
                    {
                      'field': { 'type': 'string' },
                      'order': { 'type': 'string', 'enum': ['asc', 'desc'] },
                    },
                },
            },
        },
    },
  'LedBalanceRequest':
    {
      'type': 'object',
      'required': ['page', 'pageSize', 'filters'],
      'additionalProperties': false,
      'properties':
        {
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 200 },
          'filters':
            {
              'type': 'object',
              'required': ['asOfDate'],
              'additionalProperties': false,
              'properties':
                {
                  'asOfDate': { 'type': 'string', 'format': 'date' },
                  'objectId': { 'type': 'string' },
                },
            },
        },
    },
}
