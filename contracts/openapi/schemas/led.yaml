{
  'LedOpeningSaveRequest':
    {
      'type': 'object',
      'required':
        ['revision', 'cutoverDate', 'inventory', 'fund', 'party', 'container'],
      'additionalProperties': false,
      'properties':
        {
          'revision': { 'type': 'integer', 'format': 'int64' },
          'cutoverDate': { 'type': 'string', 'format': 'date' },
          'inventory':
            {
              'type': 'array',
              'items':
                {
                  'type': 'object',
                  'required':
                    [
                      'warehouse',
                      'product',
                      'quantity',
                      'unitPrice',
                      'currency',
                    ],
                  'additionalProperties': false,
                  'properties':
                    {
                      'warehouse':
                        {
                          'type': 'object',
                          'required': ['objectId', 'versionId'],
                          'additionalProperties': false,
                          'properties':
                            {
                              'objectId': { 'type': 'string' },
                              'versionId': { 'type': 'string' },
                            },
                        },
                      'product':
                        {
                          'type': 'object',
                          'required': ['objectId', 'versionId'],
                          'additionalProperties': false,
                          'properties':
                            {
                              'objectId': { 'type': 'string' },
                              'versionId': { 'type': 'string' },
                            },
                        },
                      'quantity': { 'type': 'string' },
                      'unitPrice': { 'type': 'string' },
                      'currency': { 'type': 'string', 'pattern': '^[A-Z]{3}$' },
                    },
                },
            },
          'fund':
            {
              'type': 'array',
              'items':
                {
                  'type': 'object',
                  'additionalProperties': true,
                  'properties': {},
                },
            },
          'party':
            {
              'type': 'array',
              'items':
                {
                  'type': 'object',
                  'additionalProperties': true,
                  'properties': {},
                },
            },
          'container':
            {
              'type': 'array',
              'items':
                {
                  'type': 'object',
                  'additionalProperties': true,
                  'properties': {},
                },
            },
        },
    },
  'LedRevisionRequest':
    {
      'type': 'object',
      'required': ['revision'],
      'additionalProperties': false,
      'properties': { 'revision': { 'type': 'integer', 'format': 'int64' } },
    },
  'LedReopenRequest':
    {
      'type': 'object',
      'required': ['revision', 'reason'],
      'additionalProperties': false,
      'properties':
        {
          'revision': { 'type': 'integer', 'format': 'int64' },
          'reason': { 'type': 'string' },
        },
    },
  'LedHistoryRequest':
    {
      'type': 'object',
      'required': ['page', 'pageSize'],
      'additionalProperties': false,
      'properties':
        {
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 200 },
        },
    },
  'LedQueryRequest':
    {
      'type': 'object',
      'required': ['page', 'pageSize', 'filters', 'sort'],
      'additionalProperties': false,
      'properties':
        {
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 200 },
          'filters':
            {
              'type': 'object',
              'required': ['dateFrom', 'dateTo'],
              'additionalProperties': false,
              'properties':
                {
                  'dateFrom': { 'type': 'string', 'format': 'date' },
                  'dateTo': { 'type': 'string', 'format': 'date' },
                  'objectId': { 'type': 'string' },
                  'sourceEntity': { 'type': 'string' },
                  'documentNo': { 'type': 'string' },
                  'direction':
                    { 'type': 'array', 'items': { 'type': 'string' } },
                },
            },
          'sort':
            {
              'type': 'array',
              'items':
                {
                  'type': 'object',
                  'required': ['field', 'order'],
                  'additionalProperties': false,
                  'properties':
                    {
                      'field': { 'type': 'string' },
                      'order': { 'type': 'string', 'enum': ['asc', 'desc'] },
                    },
                },
            },
        },
    },
  'LedBalanceRequest':
    {
      'type': 'object',
      'required': ['page', 'pageSize', 'filters'],
      'additionalProperties': false,
      'properties':
        {
          'page': { 'type': 'integer', 'minimum': 1 },
          'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 200 },
          'filters':
            {
              'type': 'object',
              'required': ['asOfDate'],
              'additionalProperties': false,
              'properties':
                {
                  'asOfDate': { 'type': 'string', 'format': 'date' },
                  'objectId': { 'type': 'string' },
                },
            },
        },
    },
}
