RptParameterType:
  type: string
  enum: [TEXT, INTEGER, DECIMAL, BOOLEAN, DATE, DATE_RANGE, ENUM, REFERENCE]

RptReferenceType:
  type: string
  enum:
    [
      ACCOUNTING_BOOK,
      ACCOUNT_SUBJECT,
      CUSTOMER_ACCOUNT,
      SUPPLIER,
      OTHER_UNIT,
      EMPLOYEE,
      SALES_PARTNER,
      DEPARTMENT,
      PRODUCT,
      WAREHOUSE,
      FUND_ACCOUNT,
      ASSET,
      BILL,
      COUNTERPARTY,
    ]

RptResultType:
  type: string
  enum: [TEXT, INTEGER, DECIMAL, BOOLEAN, DATE, DATETIME, ID]

RptParameter:
  type: object
  additionalProperties: false
  required: [key, name, type, required]
  properties:
    key: { type: string, pattern: '^[a-z][a-zA-Z0-9]{0,63}$' }
    name: { type: string, minLength: 1, maxLength: 100 }
    type: { $ref: '#/RptParameterType' }
    required: { type: boolean }
    defaultValue: {}
    enumValues:
      type: array
      uniqueItems: true
      items: { type: string, maxLength: 200 }
    referenceType: { $ref: '#/RptReferenceType' }

RptResultColumn:
  type: object
  additionalProperties: false
  required: [alias, name, order, type, width, visible]
  properties:
    alias: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}[a-z0-9]$' }
    name: { type: string, minLength: 1, maxLength: 100 }
    order: { type: integer, minimum: 1 }
    type: { $ref: '#/RptResultType' }
    width: { type: integer, minimum: 60, maximum: 1000 }
    visible: { type: boolean }
    format: { type: string, maxLength: 100 }
    drilldownEntity: { type: string, enum: [VOU] }

RptVersionData:
  type: object
  additionalProperties: false
  required: [sql, parameters, columns]
  properties:
    sql: { type: string, minLength: 1, maxLength: 100000 }
    parameters:
      type: array
      items: { $ref: '#/RptParameter' }
    columns:
      type: array
      minItems: 1
      items: { $ref: '#/RptResultColumn' }

RptExecuteRequest:
  type: object
  additionalProperties: false
  required: [parameters]
  properties:
    parameters:
      type: object
      additionalProperties: true
    page: { type: integer, minimum: 1, default: 1 }
    pageSize: { type: integer, minimum: 1, maximum: 100, default: 50 }

RptDirectoryQueryRequest:
  type: object
  additionalProperties: false
  required: [page, pageSize]
  properties:
    page: { type: integer, minimum: 1 }
    pageSize: { type: integer, minimum: 1, maximum: 200 }

RptReferenceQueryRequest:
  type: object
  additionalProperties: false
  required: [parameterKey]
  properties:
    parameterKey: { type: string, minLength: 1, maxLength: 64 }
    keyword: { type: string, maxLength: 200 }
    selectedId: { type: string, maxLength: 64 }
    page: { type: integer, minimum: 1, default: 1 }
    pageSize: { type: integer, minimum: 1, maximum: 50, default: 20 }
RptReportMetadata:
  type: object
  additionalProperties: false
  required: [code, name, description, parameters, columns, canQuery, canExport]
  properties:
    code: { type: string }
    name: { type: string }
    description: { type: string }
    parameters:
      type: array
      items: { $ref: '#/RptParameter' }
    columns:
      type: array
      items: { $ref: '#/RptResultColumn' }
    canQuery: { type: boolean }
    canExport: { type: boolean }
RptDirectoryPageData:
  type: object
  additionalProperties: false
  required: [items, total, page, pageSize]
  properties:
    items:
      type: array
      items: { $ref: '#/RptReportMetadata' }
    total: { type: integer, format: int64 }
    page: { type: integer }
    pageSize: { type: integer }
RptQueryResult:
  type: object
  additionalProperties: false
  required: [columns, items, total, page, pageSize]
  properties:
    columns:
      type: array
      items: { $ref: '#/RptResultColumn' }
    items:
      type: array
      description: Dynamic row values are constrained by the selected report definition columns.
      items: { type: object, additionalProperties: true }
    total: { type: integer, format: int64 }
    page: { type: integer }
    pageSize: { type: integer }
RptReferenceItem:
  type: object
  additionalProperties: false
  required: [id, code, name]
  properties:
    id: { type: string }
    code: { type: string }
    name: { type: string }
RptCustomerAccountReference:
  type: object
  additionalProperties: false
  required: [id, code, name, customerCode, customerName]
  properties:
    id: { type: string, minLength: 26, maxLength: 26 }
    code: { type: string, minLength: 1, maxLength: 32 }
    name: { type: string, minLength: 1, maxLength: 200 }
    customerCode: { type: string, minLength: 1, maxLength: 32 }
    customerName: { type: string, minLength: 1, maxLength: 200 }
RptCounterpartyReference:
  type: object
  additionalProperties: false
  required: [entity, objectId, approvalEntryId, code, name]
  properties:
    entity:
      type: string
      enum: [customer-account, supplier, other-unit, employee, sales-partner]
    objectId: { type: string, minLength: 26, maxLength: 26 }
    approvalEntryId: { type: string, minLength: 26, maxLength: 26 }
    code: { type: string, minLength: 1, maxLength: 64 }
    name: { type: string, minLength: 1, maxLength: 200 }
RptReferencePageData:
  type: object
  additionalProperties: false
  required: [items, total, page, pageSize]
  properties:
    items:
      type: array
      items:
        oneOf:
          - { $ref: '#/RptReferenceItem' }
          - { $ref: '#/RptCustomerAccountReference' }
          - { $ref: '#/RptCounterpartyReference' }
    total: { type: integer, format: int64 }
    page: { type: integer }
    pageSize: { type: integer }
RptDirectoryPageResponse:
  type: object
  additionalProperties: false
  required: [code, errorKey, message, data, requestId]
  properties:
    code: { type: integer, format: int32 }
    errorKey: { type: string }
    message: { type: string }
    data: { $ref: '#/RptDirectoryPageData', nullable: true }
    requestId: { type: string }
RptQueryResponse:
  type: object
  additionalProperties: false
  required: [code, errorKey, message, data, requestId]
  properties:
    code: { type: integer, format: int32 }
    errorKey: { type: string }
    message: { type: string }
    data: { $ref: '#/RptQueryResult', nullable: true }
    requestId: { type: string }
RptReferencePageResponse:
  type: object
  additionalProperties: false
  required: [code, errorKey, message, data, requestId]
  properties:
    code: { type: integer, format: int32 }
    errorKey: { type: string }
    message: { type: string }
    data: { $ref: '#/RptReferencePageData', nullable: true }
    requestId: { type: string }
