      [
        'definitionId',
        'code',
        'name',
        'enabled',
        'approval',
        'rootEntity',
        'nodeCount',
        'updatedAt',
        'script',
        'rootNodeKey',
        'nodes',
        'edges',
      ],
    'additionalProperties': false,
    'properties':
      {
        'definitionId': { 'type': 'string' },
